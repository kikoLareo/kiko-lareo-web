<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiko Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("ks-tema");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>
</body>
</html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de gestión. Barra lateral en escritorio, barra inferior en móvil. Paleta de la marca Kiko Lareo. */
:root{
  --fondo:#F2EFE8; --tinta:#0B0B0B; --suave:#615f58; --linea:#dcd7cb; --hoja:#fbf9f4; --hover:#e9e5db; --rojo:#D9361F;
  --ok:#2c7a4b; --aviso:#9a6200; --info:#2f5f9a; --sombra:0 10px 40px rgba(0,0,0,.18);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fondo:#121211;--tinta:#EEEAE1;--suave:#a3a097;--linea:#2e2d2a;--hoja:#1a1a18;--hover:#24231f;--rojo:#FF5A43;
  --ok:#6cc08f;--aviso:#e0a83a;--info:#7fa9e0;--sombra:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#121211;--tinta:#EEEAE1;--suave:#a3a097;--linea:#2e2d2a;--hoja:#1a1a18;--hover:#24231f;--rojo:#FF5A43;
  --ok:#6cc08f;--aviso:#e0a83a;--info:#7fa9e0;--sombra:0 10px 40px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
input,select,textarea{font-size:16px}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--aviso);white-space:nowrap}
body.sin-sesion .lateral,body.sin-sesion .cabecera,body.sin-sesion .inferior{display:none}
body.sin-sesion .app{grid-template-columns:minmax(0,1fr)}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:18px}
.login .logo-g{font-weight:800;font-size:30px;letter-spacing:-.04em}
.login .logo-g span{color:var(--rojo)}
.login input{border:1px solid var(--linea);background:var(--fondo);border-radius:8px;padding:12px;font-size:17px;width:100%}
html,body{height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--display);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--fondo)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%}
.lateral{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--linea);padding:18px 10px 18px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.logo{font-weight:800;font-size:17px;letter-spacing:-.03em;padding:2px 10px 16px}
.logo span{color:var(--rojo)}
.navl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--suave);font-size:14.5px}
.navl:hover{background:var(--hover);color:var(--tinta)}
.navl.on{color:var(--tinta);background:var(--hoja);font-weight:600;box-shadow:inset 2px 0 0 var(--rojo)}
.navl .cnt{font-family:var(--mono);font-size:11px;color:var(--rojo)}
.sep{height:1px;background:var(--linea);margin:10px 6px}
.principal{min-width:0;display:flex;flex-direction:column}
.cabecera{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--fondo);border-bottom:1px solid var(--linea);display:flex;gap:10px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 24px}
.buscador{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:7px 10px;color:var(--suave);cursor:text;font-size:14px}
.buscador kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--linea);border-radius:4px;padding:0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linea);background:var(--hoja);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--tinta)}
.btn.pri{background:var(--tinta);color:var(--fondo);border-color:var(--tinta);font-weight:600}
.btn.rojo{background:var(--rojo);color:#fff;border-color:var(--rojo);font-weight:600}
.btn.peq{padding:4px 9px;font-size:13px}
.btn.txt{border-color:transparent;background:transparent;color:var(--suave)}
.btn.txt:hover{color:var(--tinta)}
.btn.peligro{color:var(--rojo)}
#vista{padding:24px max(16px,env(safe-area-inset-right,0px)) 120px 24px;max-width:1240px;width:100%}
h1{font-weight:600;font-size:28px;letter-spacing:-.03em;margin:0;text-transform:uppercase;line-height:1.05}
h2{font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0}
.tit{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.tit .acc{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--suave);font-size:14px}
.mono{font-family:var(--mono)}
.eti{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.kpi{border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .v{font-weight:600;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .d{font-family:var(--mono);font-size:11.5px;color:var(--suave)}
.kpi.est{border-style:dashed}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--tinta)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.panel{border:1px solid var(--linea);background:var(--hoja);border-radius:8px;min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--linea)}
.panel > .pb{padding:12px 14px}
.lista{display:flex;flex-direction:column}
.it{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--linea);min-width:0;flex-wrap:wrap}
.it:last-child{border-bottom:0}
.it.clic{cursor:pointer}.it.clic:hover{background:var(--hover)}
.it .h{font-family:var(--mono);font-size:12px;color:var(--suave);min-width:48px}
.it .t{flex:1;min-width:140px;overflow-wrap:anywhere}
.it .t small{display:block;color:var(--suave);font-size:12.5px}
.vacio{padding:22px 14px;color:var(--suave);font-size:14px;text-align:center}
.vacio.grande{padding:48px 20px;border:1px dashed var(--linea);border-radius:10px}
.vacio.grande h2{color:var(--tinta);margin-bottom:6px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.p-ok{color:var(--ok)}.p-av{color:var(--aviso)}.p-ro{color:var(--rojo)}.p-in{color:var(--info)}.p-gr{color:var(--suave)}
.chk{width:18px;height:18px;border:1.5px solid var(--tinta);border-radius:4px;background:transparent;cursor:pointer;flex:none;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.chk.on{background:var(--tinta);color:var(--fondo)}
.hecha .t{text-decoration:line-through;color:var(--suave)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--suave);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a.on{color:var(--tinta);border-bottom-color:var(--rojo);font-weight:600}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filtros select,.filtros input{border:1px solid var(--linea);background:var(--hoja);border-radius:7px;padding:6px 8px;font-size:13.5px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--linea);border-radius:7px;overflow:hidden}
.seg a,.seg button{padding:6px 11px;text-decoration:none;font-size:13.5px;color:var(--suave);background:var(--hoja);border:0;cursor:pointer}
.seg .on{background:var(--tinta);color:var(--fondo)}
.tabla{overflow-x:auto;border:1px solid var(--linea);border-radius:8px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--linea);vertical-align:middle;white-space:nowrap}
td.ancho{white-space:normal;min-width:200px}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:500;position:sticky;top:0;background:var(--hoja);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
tfoot td{font-weight:600;border-top:1px solid var(--tinta)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.celda{border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px;font-size:13.5px;max-width:170px}
.celda:hover,.celda:focus{border-color:var(--linea);background:var(--fondo)}
input.celda.num{width:90px}
.tlink{font-weight:600;text-decoration:none;cursor:pointer}
.tlink:hover{text-decoration:underline}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kcol{flex:0 0 250px;background:var(--hoja);border:1px solid var(--linea);border-radius:8px;display:flex;flex-direction:column;max-height:75vh}
.kcol.sobre{border-color:var(--rojo)}
.kcol .kh{padding:9px 12px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;gap:6px}
.kcol .kb{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:60px}
.tarj{background:var(--fondo);border:1px solid var(--linea);border-radius:7px;padding:9px 10px;cursor:grab;font-size:13.5px}
.tarj:hover{border-color:var(--tinta)}
.tarj b{display:block;font-weight:600;margin-bottom:2px}
.tarj .m{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--suave);font-size:12px;font-family:var(--mono);margin-top:4px}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tarjetas .tarj{cursor:pointer;padding:14px;background:var(--hoja)}
.barra{height:5px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:8px}
.barra i{display:block;height:100%;background:var(--tinta)}
.carril{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 0 4px}
.carril div{font-family:var(--mono);font-size:11px;text-align:center;padding:5px 2px;border:1px solid var(--linea);border-radius:4px;color:var(--suave)}
.carril div.on{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.carril div.act{border-color:var(--rojo);color:var(--rojo);font-weight:600}
.ficha-cab{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:4px}
.migas{font-family:var(--mono);font-size:12px;color:var(--suave);margin-bottom:8px}
.migas a{text-decoration:none}.migas a:hover{text-decoration:underline}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.datos > div{min-width:0;overflow-wrap:anywhere}
.datos .v{font-size:14.5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--linea);border-top:1px solid var(--linea);background:var(--hoja);border-radius:8px;overflow:hidden}
.cal .cd{border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);min-height:104px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.cal .cd:hover{background:var(--hover)}
.cal .cd.fuera{opacity:.45}
.cal .cd .n{font-family:var(--mono);font-size:11.5px;color:var(--suave);display:flex;justify-content:space-between}
.cal .cd.hoy .n b{background:var(--rojo);color:#fff;border-radius:99px;padding:0 6px}
.cal .ch{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--suave);padding:6px;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea)}
.ev{font-size:11.5px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor;background:var(--fondo)}
.disp{width:7px;height:7px;border-radius:50%;display:inline-block}
.d-ocupado{background:var(--rojo)}.d-provisional{background:var(--aviso)}.d-bloqueado{background:var(--suave)}
.c-rodaje{color:var(--rojo)}.c-reunion{color:var(--info)}.c-entrega{color:var(--aviso)}.c-tarea{color:var(--suave)}.c-cobro{color:var(--ok)}.c-viaje{color:var(--info)}.c-bloqueo{color:var(--suave)}.c-trabajo{color:var(--tinta)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.semana .dia{border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:4px;min-width:0}
.semana .dia.hoy{border-color:var(--rojo)}
.semana .dia .n{font-family:var(--mono);font-size:11.5px;color:var(--suave);display:flex;justify-content:space-between;gap:4px}
.lado{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.sublat{display:flex;flex-direction:column;gap:1px}
.sublat a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--suave);font-size:14px}
.sublat a.on{background:var(--hoja);color:var(--tinta);font-weight:600;box-shadow:inset 2px 0 0 var(--rojo)}
.sublat a:hover{background:var(--hover)}
.captura{display:flex;gap:8px;margin-bottom:14px}
.captura input{flex:1;min-width:0;border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:10px 12px;font-size:15px}
.grafico svg{display:block;width:100%;height:auto}
.aviso-it{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.aviso-it:last-child{border-bottom:0}
.aviso-it .t{flex:1;min-width:160px}
.marca-r{width:4px;align-self:stretch;border-radius:2px;flex:none}
.enl{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.enl:last-child{border-bottom:0}
.enl .ic{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;border:1px solid var(--linea);color:var(--suave);text-transform:uppercase}
.enl code{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;flex:1;min-width:120px}
/* Modal */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 6vh) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.velo[hidden]{display:none}
.modal{background:var(--fondo);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);width:100%;max-width:620px;display:flex;flex-direction:column}
.modal.ancho{max-width:960px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--linea);gap:10px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--linea);flex-wrap:wrap}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.full{grid-column:1/-1}
.campo label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.campo input,.campo select,.campo textarea{border:1px solid var(--linea);background:var(--hoja);border-radius:7px;padding:8px 10px;font-size:15px;width:100%;min-width:0}
.campo textarea{min-height:76px;resize:vertical}
.campo .ayuda{font-size:12px;color:var(--suave)}
.campo.check{flex-direction:row;align-items:center;gap:8px}
.campo.check input{width:auto}
.mas{grid-column:1/-1}
.mas summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--suave);padding:4px 0}
.mas .campos{margin-top:10px}
.plt{border:1px solid var(--linea);border-radius:8px;background:var(--hoja);max-height:220px;overflow-y:auto}
.plt label{display:flex;gap:8px;padding:5px 10px;border-bottom:1px solid var(--linea);font-size:13.5px;align-items:center}
.plt label span{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--suave)}
.menu-crear{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.menu-crear button{border:1px solid var(--linea);background:var(--hoja);border-radius:9px;padding:16px 12px;cursor:pointer;text-align:left;font-size:15px;font-weight:600}
.menu-crear button small{display:block;font-weight:400;color:var(--suave);font-size:12px;margin-top:2px}
.menu-crear button:hover{border-color:var(--tinta)}
.res-busc{display:flex;flex-direction:column;max-height:55vh;overflow-y:auto}
.res-busc .g{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--suave);padding:10px 4px 4px}
.res-busc a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;cursor:pointer}
.res-busc a:hover,.res-busc a.sel{background:var(--hover)}
.res-busc a small{color:var(--suave);margin-left:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--tinta);color:var(--fondo);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--sombra);max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
.inferior{display:none}
.estado-carga{padding:60px 20px;text-align:center;color:var(--suave)}
.nota-it{padding:10px 14px;border-bottom:1px solid var(--linea)}
.nota-it:last-child{border-bottom:0}
.nota-it p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cifras{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:14px}
.cifras .num{font-weight:600}
.imp-tabla td,.imp-tabla th{font-size:12.5px}
.malo{color:var(--rojo)}
.oculto{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{display:none}
  .cabecera{padding-left:max(16px,env(safe-area-inset-left,0px))}
  #vista{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .cols,.lado{grid-template-columns:minmax(0,1fr)}
  .sublat{flex-direction:row;overflow-x:auto;gap:4px}

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const isoDe = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const hoy = () => isoDe(new Date());
const aFecha = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const sumaDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate()+n); return isoDe(d); };
const sumaMeses = (s, n) => { const d = aFecha(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ult = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(dia, ult)); return isoDe(d); };
const difDias = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 864e5);
const fmtCorta = new Intl.DateTimeFormat("es-ES", {weekday:"short", day:"numeric", month:"short"});
const fmtLarga = new Intl.DateTimeFormat("es-ES", {weekday:"long", day:"numeric", month:"long"});
const fmtMes = new Intl.DateTimeFormat("es-ES", {month:"long", year:"numeric"});
const fmtMesC = new Intl.DateTimeFormat("es-ES", {month:"short"});
const fF = s => s ? fmtCorta.format(aFecha(s)).replace(".", "") : "—";
const fFA = s => s ? aFecha(s).toLocaleDateString("es-ES") : "—";
const eurF = new Intl.NumberFormat("es-ES", {style:"currency", currency:"EUR", useGrouping:"always"});
const eurF0 = new Intl.NumberFormat("es-ES", {style:"currency", currency:"EUR", maximumFractionDigits:0, useGrouping:"always"});
const eur = (n, dec=true) => (dec ? eurF : eurF0).format(Math.round((+n||0)*100)/100);
const suma = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const numO = (v, d) => v === "" || v == null || isNaN(+v) ? d : +v;
const urlSegura = u => /^https:\/\//i.test(String(u||"").trim());
function parseNum(v){
  if (typeof v === "number") return v;
  let s = String(v ?? "").replace(/[^\d,.\-]/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(",", ".");
  else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s);
}
function parseFecha(v){
  const s = String(v ?? "").trim(); if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){ let y = +m[3]; if (y < 100) y += 2000; const d = +m[1], mo = +m[2]; if (mo>=1 && mo<=12 && d>=1 && d<=31) return y+"-"+pad(mo)+"-"+pad(d); }
  return "";
}
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 3200); }
const stor = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

/* ============ configuración por defecto ============ */
const FASES = {comercial:"Comercial", preparacion:"Preparación", produccion:"Producción", cierre:"Cierre"};
const DEF = {
  estados: [
    ["Oportunidad","comercial"],["Contactado","comercial"],["Presupuesto enviado","comercial"],
    ["Confirmado","preparacion"],["En planificación","preparacion"],["Pendiente de realización","preparacion"],
    ["En producción","produccion"],["En edición","produccion"],["Pendiente de revisión","produccion"],["Pendiente de entrega","produccion"],
    ["Entregado","cierre"],["Finalizado","cierre"],["Cancelado","cierre"]
  ].map(([n,f]) => ({n, f})),
  tipos: ["Cobertura deportiva","Sesión comercial","Producto","Moda","Lifestyle","Producción audiovisual","Edición","Contenido redes","Dirección creativa","Evento / experiencia","Colaboración","Otro"],
  tiposCliente: ["Club deportivo","Marca","Empresa","Agencia","Evento","Particular","Otro"],
  plantillas: [
    {id:"p-deporte", nombre:"Cobertura deportiva", tipo:"Cobertura deportiva", tareas:[["Preparación",-1],["Desplazamiento",0],["Cobertura",0],["Selección",1],["Edición",2],["Exportación",2],["Entrega",3],["Facturación externa",3],["Cobro",33]]},
    {id:"p-audiovisual", nombre:"Producción audiovisual", tipo:"Producción audiovisual", tareas:[["Briefing",-21],["Idea y concepto",-18],["Guion",-14],["Planificación",-10],["Rodaje",0],["Organización de archivos",1],["Montaje",5],["Color",8],["Sonido",9],["Revisiones",12],["Exportación",14],["Entrega",15]]},
    {id:"p-comercial", nombre:"Sesión comercial", tipo:"Sesión comercial", tareas:[["Briefing",-14],["Referencias visuales",-12],["Moodboard",-10],["Localización",-7],["Equipo",-2],["Sesión",0],["Selección",2],["Edición",4],["Envío para selección",5],["Entrega final",8]]}
  ],
  automatismos: true, ivaDef: 21, irpfDef: 7, plazoPago: 30
};
const PRIORIDADES = ["Baja","Normal","Alta","Urgente"];
const TIPOS_EVENTO = [["rodaje","Rodaje / sesión / cobertura"],["reunion","Reunión"],["viaje","Viaje de trabajo"],["entrega","Entrega / revisión"],["bloqueo","Bloqueo (no disponible)"],["otro","Otro"]];
const ESTADOS_EVENTO = [["confirmado","Confirmado"],["provisional","Provisional"],["bloqueado","Bloqueado"]];
const ESTADOS_TAREA = [["pendiente","Pendiente"],["curso","En curso"],["esperando","Esperando a alguien"],["hecha","Hecha"]];
const TIPOS_NOTA = ["Indicación del cliente","Cambio solicitado","Requisito","Idea","Decisión","Nota"];
const TIPOS_ENLACE = [["Originales","local"],["Catálogo Lightroom","local"],["Proyecto DaVinci","local"],["Disco","local"],["Backup","local"],["Google Drive","web"],["Pic-Time","web"],["Entrega","web"],["Briefing","web"],["Documento","web"],["Otro","web"]];
const METODOS = ["Transferencia","Bizum","Efectivo","Tarjeta","PayPal","Otro"];
const COLS = ["clientes","trabajos","tareas","eventos","facturas","cobros","bandeja"];

/* ============ estado ============ */
const S = {clientes:[], trabajos:[], tareas:[], eventos:[], facturas:[], cobros:[], bandeja:[], cfg:null, listo:{}, db:null, sinConexion:false};
const vivos = col => S[col].filter(x => !x.borrado);
const porId = (col, id) => S[col].find(x => x.id === id);
const cfg = () => Object.assign({}, DEF, S.cfg || {});
const estados = () => cfg().estados;
const faseDe = e => (estados().find(x => x.n === e) || {}).f || "preparacion";
const UI = { trabajos:{vista:"tabla", f:{}, orden:"fecha", dir:1}, tareas:"hoy", agenda:{vista:"mes", ref:hoy(), capas:{eventos:1,trabajos:1,entregas:1,tareas:1,cobros:1}}, dinero:{anio:new Date().getFullYear()}, tabTrabajo:"resumen", imp:null };
try { const u = JSON.parse(stor.get("ks-ui") || "null"); if (u && u.trabajos) { UI.trabajos.vista = u.trabajos.vista || "tabla"; UI.trabajos.f = u.trabajos.f || {}; } if (u && u.tareas) UI.tareas = u.tareas; } catch(e){}
const guardarUI = () => stor.set("ks-ui", JSON.stringify({trabajos:{vista:UI.trabajos.vista, f:UI.trabajos.f}, tareas:UI.tareas}));

/* ============ escritura (cola local que se envía al servidor) ============ */
const API = { token: stor.get("ks-token") || "" };
let cola = []; try { cola = JSON.parse(stor.get("ks-cola") || "[]") || []; } catch(e){ cola = []; }
const guardarCola = () => stor.set("ks-cola", JSON.stringify(cola));
function limpio(o){ const c = Object.assign({}, o); delete c.id; Object.keys(c).forEach(k => c[k] === undefined && delete c[k]); return JSON.parse(JSON.stringify(c)); }
function encolar(col, id, data){ cola = cola.filter(o => !(o.col === col && o.id === id)); cola.push({col, id, data}); guardarCola(); guardarCache(); programarEnvio(); estadoSync(); }
async function guardar(col, obj){
  if (!obj.id) obj.id = uid();
  if (!obj.creado) obj.creado = new Date().toISOString();
  obj.mod = new Date().toISOString();
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  encolar(col, obj.id, limpio(obj)); programar();
  return obj;
}
const cambiar = (col, id, patch) => { const o = porId(col, id); if (!o) return; return guardar(col, Object.assign(JSON.parse(JSON.stringify(o)), patch)); };
async function borrarDef(col, id){ S[col] = S[col].filter(x => x.id !== id); encolar(col, id, null); programar(); }
const aPapelera = (col, id) => cambiar(col, id, {borrado: new Date().toISOString()});
async function guardarCfg(patch){ S.cfg = Object.assign({}, S.cfg || {}, patch); encolar("ajustes", "general", JSON.parse(JSON.stringify(S.cfg))); programar(); }

/* ============ cálculos ============ */
function fin(t){
  const precio = +t.precio || 0, iva = numO(t.iva, +cfg().ivaDef), irpf = numO(t.irpf, 0);
  const factor = 1 + (iva - irpf) / 100;
  const facs = vivos("facturas").filter(f => f.trabajoId === t.id && !f.anulada);
  const cobs = vivos("cobros").filter(c => c.trabajoId === t.id);
  const facBase = suma(facs, f => f.base);
  const facLiq = suma(facs, f => (+f.base||0) * (1 + (numO(f.iva, iva) - numO(f.irpf, irpf)) / 100));
  const cobrado = suma(cobs, c => c.importe);
  const total = precio * factor;
  const pendFacturar = t.noFacturable || t.estado === "Cancelado" ? 0 : Math.max(0, precio - facBase);
  const pendCobro = Math.max(0, facLiq - cobrado);
  const pendTotal = t.estado === "Cancelado" ? 0 : Math.max(0, total - cobrado);
  const cobradoBase = factor ? cobrado / factor : cobrado;
  const vencido = !!(t.cobroPrevisto && t.cobroPrevisto < hoy() && pendCobro > 0.5);
  let ec;
  if (t.noFacturable) ec = "No facturable";
  else if (t.estado === "Cancelado") ec = cobrado > 0 ? "Cobro parcial" : "—";
  else if (precio <= 0 && cobrado <= 0) ec = "Sin importe";
  else if (total > 0 && cobrado >= total - 0.5) ec = "Cobrado";
  else if (vencido) ec = "Cobro vencido";
  else if (cobrado > 0) ec = "Cobro parcial";
  else if (facBase <= 0) ec = "Sin facturar";
  else if (facBase < precio - 0.5) ec = "Facturado parcial";
  else ec = "Facturado";
  return {precio, iva, irpf, factor, total, facs, cobs, facBase, facLiq, cobrado, cobradoBase, pendFacturar, pendCobro, pendTotal, vencido, ec};
}
const CLASE_EC = {"Cobrado":"p-ok","Cobro parcial":"p-av","Cobro vencido":"p-ro","Sin facturar":"p-gr","Facturado parcial":"p-in","Facturado":"p-in","No facturable":"p-gr","Sin importe":"p-gr","—":"p-gr"};
const pillEc = ec => `<span class="pill ${CLASE_EC[ec]||"p-gr"}">${esc(ec)}</span>`;
const CLASE_FASE = {comercial:"p-gr", preparacion:"p-in", produccion:"p-av", cierre:"p-ok"};
const pillEstado = e => `<span class="pill ${e==="Cancelado"?"p-gr":CLASE_FASE[faseDe(e)]}">${esc(e||"—")}</span>`;
const pillPrio = p => p && p !== "Normal" ? `<span class="pill ${p==="Urgente"?"p-ro":p==="Alta"?"p-av":"p-gr"}">${esc(p)}</span>` : "";
function cobroBase(c){
  if (c.trabajoId){ const t = porId("trabajos", c.trabajoId); if (t) return (+c.importe||0) / fin(t).factor; }
  return (+c.importe||0) / (1 + ((+c.iva||0) - (+c.irpf||0)) / 100);
}
const esActivo = t => ["preparacion","produccion"].includes(faseDe(t.estado));
const nombreCliente = id => (porId("clientes", id) || {}).nombre || "";
const horasTareas = t => vivos("tareas").filter(x => x.trabajoId === t.id);
function clienteStats(c){
  const ts = vivos("trabajos").filter(t => t.clienteId === c.id);
  const fs = ts.map(fin);
  const fechas = ts.filter(t => t.fecha && t.fecha <= hoy() && t.estado !== "Cancelado").map(t => t.fecha).sort();
  const ultimo = fechas[fechas.length-1] || "";
  const hace12 = sumaMeses(hoy(), -12);
  const recientes = ts.filter(t => t.fecha && t.fecha >= hace12 && t.estado !== "Cancelado").length;
  const sueltos = vivos("cobros").filter(x => !x.trabajoId && x.clienteId === c.id);
  return {ts, n: ts.length, activos: ts.filter(esActivo).length, presupuesto: suma(fs, f => f.precio),
    cobrado: suma(fs, f => f.cobradoBase) + suma(sueltos, cobroBase), pendiente: suma(fs, f => f.pendTotal), ultimo,
    recurrente: c.recurrente === "si" || (c.recurrente !== "no" && recientes >= 3)};
}

/* ============ automatismos ============ */
function historial(viejo, nuevo){
  const campos = {estado:"Estado", fecha:"Fecha", fechaEntrega:"Entrega", precio:"Precio", clienteId:"Cliente", cobroPrevisto:"Cobro previsto", nombre:"Nombre"};
  const h = (nuevo.historial || []).slice();
  for (const [k, l] of Object.entries(campos)){
    const a = viejo ? viejo[k] : undefined, b = nuevo[k];
    if (viejo && String(a ?? "") !== String(b ?? "")){
      const fmt = v => k === "clienteId" ? nombreCliente(v) || "—" : k === "precio" ? eur(v) : (k.startsWith("fecha")||k==="cobroPrevisto") ? fFA(v) : (v || "—");
      h.unshift({f: new Date().toISOString(), t: `${l}: ${fmt(a)} → ${fmt(b)}`});
    }
  }
  if (!viejo) h.unshift({f: new Date().toISOString(), t: "Trabajo creado"});
  nuevo.historial = h.slice(0, 120);
  return nuevo;
}
async function guardarTrabajo(nuevo){
  const viejo = nuevo.id ? porId("trabajos", nuevo.id) : null;
  historial(viejo, nuevo);
  const pasaEntregado = nuevo.estado === "Entregado" && (!viejo || viejo.estado !== "Entregado");
  if (pasaEntregado && cfg().automatismos){
    if (!nuevo.entregaReal) nuevo.entregaReal = hoy();
  }
  const t = await guardar("trabajos", nuevo);
  if (pasaEntregado && cfg().automatismos){
    const f = fin(t);
    if (!t.noFacturable && f.pendFacturar > 0.5 && !vivos("tareas").some(x => x.trabajoId === t.id && x.auto === "facturar")){
      await guardar("tareas", {nombre: "Facturar en Ayudat: " + t.nombre, estado:"pendiente", prioridad:"Alta", fecha: hoy(), trabajoId: t.id, categoria:"Administración", auto:"facturar"});
      toast("Entregado. Te he dejado la tarea de facturar.");
    } else toast("Marcado como entregado");
  }
  return t;
}
async function completarTarea(id){
  const t = porId("tareas", id); if (!t) return;
  const hecha = t.estado !== "hecha";
  await cambiar("tareas", id, {estado: hecha ? "hecha" : "pendiente", completada: hecha ? hoy() : ""});
  if (hecha && t.recurrencia && t.recurrencia !== "no"){
    const base = t.fecha || hoy();
    const sig = t.recurrencia === "diaria" ? sumaDias(base,1) : t.recurrencia === "semanal" ? sumaDias(base,7) : t.recurrencia === "mensual" ? sumaMeses(base,1) : sumaMeses(base,3);
    const n = JSON.parse(JSON.stringify(t)); delete n.id; delete n.creado; n.estado = "pendiente"; n.completada = ""; n.fecha = sig;
    n.subtareas = (n.subtareas||[]).map(s => ({t:s.t, h:false}));
    await guardar("tareas", n);
    toast("Hecha. La siguiente queda para el " + fF(sig));
  }
}

/* ============ conexión con el servidor ============ */
let renderPend = false;
function programar(){ if (renderPend) return; renderPend = true; requestAnimationFrame(() => { renderPend = false; render(); }); }
async function api(ruta, op={}){
  const cab = {"content-type":"application/json"}; if (API.token) cab.authorization = "Bearer " + API.token;
  const r = await fetch("/api/" + ruta, Object.assign({}, op, {headers: cab, cache: "no-store"}));
  let d = null; try { d = await r.json(); } catch(e){}
  if (r.status === 401 && ruta !== "login"){ salir(false); throw Object.assign(new Error("sesion"), {code:"sesion"}); }
  if (!r.ok) throw Object.assign(new Error((d && d.error) || ("error " + r.status)), {code: d && d.error, status: r.status});
  return d;
}
let envioT = null, enviando = false;
function programarEnvio(ms=400){ clearTimeout(envioT); envioT = setTimeout(enviar, ms); }
async function enviar(){
  if (enviando || !cola.length || !API.token) return;
  enviando = true; const lote = cola.slice(0, 400);
  try { await api("lote", {method:"POST", body: JSON.stringify({ops: lote})}); cola = cola.filter(o => !lote.includes(o)); guardarCola(); S.sinRed = false; }
  catch(e){ if (e.code !== "sesion"){ S.sinRed = true; programarEnvio(15000); } }
  enviando = false; estadoSync(); if (cola.length && !S.sinRed) programarEnvio(50);
}
function aplicarDatos(d){
  COLS.forEach(c => { S[c] = Object.entries(d[c] || {}).map(([id, o]) => Object.assign({}, o, {id})); });
  S.cfg = d.ajustes && d.ajustes.general ? Object.assign({}, d.ajustes.general) : null;

function itemsDelDia(d){
  const items = [];
  vivos("eventos").forEach(e => { if (enFecha(e, d)) items.push({h:e.hora||"", tipo:e.tipo||"otro", t:e.titulo, sub: e.trabajoId ? (porId("trabajos",e.trabajoId)||{}).nombre : e.ubicacion, a:"editarEvento", id:e.id, estado:e.estado}); });
  vivos("trabajos").forEach(t => {
    if (t.estado === "Cancelado") return;
    if (t.fecha === d && !vivos("eventos").some(e => e.trabajoId === t.id && enFecha(e, d))) items.push({h:t.hora||"", tipo:"rodaje", t:t.nombre, sub:nombreCliente(t.clienteId) + (t.ubicacion ? " · " + t.ubicacion : ""), href:"#trabajo-"+t.id});

    (t.entregables||[]).forEach(en => { if (en.fecha === d && en.estado !== "Entregado") items.push({h:"", tipo:"entrega", t:"Entregable: " + en.nombre, sub:t.nombre, href:"#trabajo-"+t.id}); });
  });
  return items.sort((a,b) => (a.h||"99").localeCompare(b.h||"99"));
}
function enFecha(e, d){
  if (!e.fecha) return false;
  if (e.fechaFin && e.fechaFin > e.fecha) { if (d < e.fecha || d > e.fechaFin) return false; }
  else if (!e.repetir || e.repetir === "no") return e.fecha === d;
  if (d < e.fecha) return false;
  if (e.hasta && d > e.hasta) return false;
  if ((e.excepciones||[]).includes(d)) return false;
  if (e.repetir === "semanal") return difDias(e.fecha, d) % 7 === 0;
  if (e.repetir === "mensual") return aFecha(e.fecha).getDate() === aFecha(d).getDate();
  if (e.fechaFin && e.fechaFin > e.fecha) return true;
  return e.fecha === d;
}

function dispDia(d){
  let r = "";
  vivos("eventos").forEach(e => { if (!enFecha(e, d)) return; if (e.tipo === "bloqueo" || e.estado === "bloqueado") r = r || "bloqueado"; else if (e.estado === "provisional") { if (r !== "ocupado") r = "provisional"; } else if (["rodaje","viaje"].includes(e.tipo)) r = "ocupado"; });
  vivos("trabajos").forEach(t => { if (t.fecha === d && esActivo(t)) r = "ocupado"; else if (t.fecha === d && faseDe(t.estado) === "comercial" && !r) r = "provisional"; });
  return r;
}

/* ============ TRABAJOS ============ */
function filtrarTrabajos(){
  const f = UI.trabajos.f, q = norm(f.q);
  let ts = vivos("trabajos").filter(t => !t.archivado || f.ambito === "historico" || f.ambito === "todos");
  if (f.ambito === "activos" || !f.ambito) ts = ts.filter(t => faseDe(t.estado) !== "cierre" || fin(t).pendTotal > 0.5 && t.estado !== "Cancelado" && !t.noFacturable);
  if (f.ambito === "historico") ts = ts.filter(t => faseDe(t.estado) === "cierre");
  if (f.cliente) ts = ts.filter(t => t.clienteId === f.cliente);
  if (f.tipo) ts = ts.filter(t => t.tipo === f.tipo);
  if (f.estado) ts = ts.filter(t => t.estado === f.estado);
  if (f.ec) ts = ts.filter(t => fin(t).ec === f.ec);
  if (f.prioridad) ts = ts.filter(t => (t.prioridad||"Normal") === f.prioridad);
  if (f.campana) ts = ts.filter(t => t.campana === f.campana);
  if (f.desde) ts = ts.filter(t => (t.fecha||"") >= f.desde);
  if (f.hasta) ts = ts.filter(t => t.fecha && t.fecha <= f.hasta);
  if (q) ts = ts.filter(t => norm([t.nombre, nombreCliente(t.clienteId), t.tipo, t.campana, (t.etiquetas||[]).join(" "), t.ubicacion].join(" ")).includes(q));
  const o = UI.trabajos.orden, dir = UI.trabajos.dir;
  const val = t => o === "cliente" ? norm(nombreCliente(t.clienteId)) : o === "precio" ? (+t.precio||0) : o === "pend" ? fin(t).pendTotal : o === "estado" ? estados().findIndex(e => e.n === t.estado) : o === "nombre" ? norm(t.nombre) : (t[o] || "9999");
  return ts.sort((a,b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}
const opciones = (lista, sel, vacioTxt) => (vacioTxt !== undefined ? `<option value="">${esc(vacioTxt)}</option>` : "") + lista.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(v)===String(sel??"")?"selected":""}>${esc(l)}</option>`; }).join("");
const listaClientes = () => vivos("clientes").sort((a,b) => norm(a.nombre).localeCompare(norm(b.nombre))).map(c => [c.id, c.nombre]);
const campanas = () => [...new Set(vivos("trabajos").map(t => t.campana).filter(Boolean))].sort();
function vTrabajos(){
  const f = UI.trabajos.f, vista = UI.trabajos.vista;
  const ts = filtrarTrabajos();

  const hayFiltro = ["cliente","tipo","estado","ec","prioridad","campana","desde","hasta","q"].some(k => f[k]);
  let cuerpo = "";
  if (!vivos("trabajos").length) cuerpo = vacio("Aún no hay trabajos", "Crea el primero o importa tu Google Sheets.", `<div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn pri" data-a="nuevoTrabajo">+ Nuevo trabajo</button><a class="btn" href="#importar">Importar Sheets</a></div>`);

    <input type="date" data-ft="desde" value="${esc(f.desde||"")}" aria-label="Desde" title="Desde"><input type="date" data-ft="hasta" value="${esc(f.hasta||"")}" aria-label="Hasta" title="Hasta">
    ${hayFiltro ? `<button class="btn peq txt" data-a="limpiarFiltros">Quitar filtros</button>` : ""}` : ""}

}
function tablaTrabajos(ts){

    <thead><tr>${th("nombre","Trabajo")}${th("cliente","Cliente")}${th("estado","Estado")}${th("fecha","Fecha")}${th("fechaEntrega","Entrega")}${th("precio","Precio","num")}<th>Cobro</th>${th("pend","Pendiente","num")}<th>Prioridad</th></tr></thead>
    <tbody>${ts.map((t,i) => { const f = fs[i]; return `<tr>
      <td class="ancho">${linkTrabajo(t)}${t.campana?`<div class="sub" style="font-size:12px">${esc(t.campana)}</div>`:""}${barraTareas(t)}</td>

      <td><input class="celda" type="date" data-c="fecha" data-id="${esc(t.id)}" value="${esc(t.fecha||"")}" aria-label="Fecha"></td>
      <td><input class="celda" type="date" data-c="fechaEntrega" data-id="${esc(t.id)}" value="${esc(t.fechaEntrega||"")}" aria-label="Entrega"></td>
      <td class="num"><input class="celda num" inputmode="decimal" data-c="precio" data-id="${esc(t.id)}" value="${t.precio!=null&&t.precio!==""?esc(String(t.precio).replace(".",",")):""}" aria-label="Precio"></td>
      <td>${pillEc(f.ec)}</td>
      <td class="num">${f.pendTotal > 0.5 ? eur(f.pendTotal) : "—"}</td>
      <td><select class="celda" data-c="prioridad" data-id="${esc(t.id)}" aria-label="Prioridad">${opciones(PRIORIDADES, t.prioridad||"Normal")}</select></td></tr>`; }).join("")}</tbody>
    <tfoot><tr><td colspan="5">${ts.length} trabajos</td><td class="num">${eur(suma(fs,f=>f.precio))}</td><td></td><td class="num">${eur(suma(fs,f=>f.pendTotal))}</td><td></td></tr></tfoot>
  </table></div><p class="sub" style="font-size:12.5px">Las celdas se editan directamente. Los importes van sin IVA; "pendiente" es lo que queda por cobrar con IVA y retención.</p>`;

function tarjetaTrabajo(t){

function vCampanasLista(){

function vCampana(){

function vTrabajo(id){

    let c = "";

    else if (k === "entrega") c = t.estado === "Pendiente de entrega" ? "act" : fase === "cierre" ? "on" : "";

  const tabs = [["resumen","Resumen"],["entregables","Entregables " + ((t.entregables||[]).length||"")],["tareas",`Tareas ${ts.length?hechas+"/"+ts.length:""}`],["dinero","Dinero"],["agenda","Agenda"],["archivos","Archivos"],["notas","Notas " + ((t.notasLista||[]).length||"")],["historial","Historial"]];
  const cuerpo = {resumen:tabResumen, entregables:tabEntregables, tareas:tabTareas, dinero:tabDinero, agenda:tabAgenda, archivos:tabArchivos, notas:tabNotas, historial:tabHistorial}[tab] || tabResumen;
  return `<div class="migas"><a href="#trabajos">Trabajos</a>${t.campana?` › <a href="#trabajos" data-a="abrirCampana" data-c="${esc(t.campana)}">${esc(t.campana)}</a>`:""}</div>

    <div class="ficha-cab" style="margin-top:8px"><select class="celda" data-c="estado" data-id="${esc(t.id)}" style="font-weight:600;border-color:var(--linea)" aria-label="Estado">${opciones(estados().map(e=>e.n), t.estado)}</select>${pillEc(f.ec)}${pillPrio(t.prioridad)}${t.clienteId?`<span class="sub">${linkCliente(t.clienteId)}</span>`:""}${t.tipo?`<span class="sub">· ${esc(t.tipo)}</span>`:""}${t.archivado?`<span class="pill p-gr">archivado</span>`:""}</div></div>

  <div class="carril">${carril}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l]) => `<a href="#trabajo-${esc(t.id)}" class="${tab===k?"on":""}" data-a="tab" data-t="${k}">${esc(l)}</a>`).join("")}</div>
  ${cuerpo(t, f)}`;
}

/* ============ AGENDA ============ */
function itemsCal(d){
  const c = UI.agenda.capas, L = [];
  if (c.eventos) vivos("eventos").forEach(e => { if (enFecha(e, d)) L.push({t:(e.hora?e.hora+" ":"")+e.titulo, k:e.tipo||"otro", a:"editarEvento", id:e.id, prov:e.estado==="provisional"}); });
  vivos("trabajos").forEach(t => {
    if (t.estado === "Cancelado") return;
    if (c.trabajos && t.fecha === d) L.push({t:(t.hora?t.hora+" ":"")+t.nombre, k:"rodaje", a:"abrirTrabajo", id:t.id, prov:faseDe(t.estado)==="comercial"});
    if (c.entregas && t.fechaEntrega === d) L.push({t:"Entrega · "+t.nombre, k:"entrega", a:"abrirTrabajo", id:t.id});
    if (c.entregas) (t.entregables||[]).forEach(en => { if (en.fecha === d) L.push({t:"Entrega · "+en.nombre, k:"entrega", a:"abrirTrabajo", id:t.id}); });
    if (c.cobros && t.cobroPrevisto === d && fin(t).pendTotal > 0.5) L.push({t:"Cobro · "+t.nombre, k:"cobro", a:"abrirTrabajo", id:t.id});
  });
  if (c.tareas) vivos("tareas").forEach(t => { if (t.fecha === d && t.estado !== "hecha") L.push({t:"☐ "+t.nombre, k:"tarea", a:"editarTarea", id:t.id}); });
  return L;
}
function vAgenda(){

  if (A.vista === "mes"){

    }
    cuerpo = `<div class="cal">${celdas}</div>`;
  } else if (A.vista === "semana"){
    const ini = new Date(r); ini.setDate(r.getDate() - (r.getDay()+6)%7);

    cuerpo = `<div class="panel"><div class="lista">${filas || `<div class="vacio">Nada en los próximos 60 días</div>`}</div></div>`;
  }

    <div class="acc"><button class="btn" data-a="mover" data-n="-1" aria-label="Anterior">‹</button><button class="btn" data-a="mover" data-n="0">Hoy</button><button class="btn" data-a="mover" data-n="1" aria-label="Siguiente">›</button><button class="btn pri" data-a="nuevoEvento">+ Evento</button></div></div>

/* ============ TAREAS ============ */
function tareasDe(v){
  const d = hoy(), man = sumaDias(d,1), fs = sumaDias(d, 7 - ((aFecha(d).getDay()+6)%7) - 1);
  const p = vivos("tareas").filter(t => t.estado !== "hecha");
  const ord = a => a.sort((x,y) => (x.fecha||"9").localeCompare(y.fecha||"9") || PRIORIDADES.indexOf(y.prioridad||"Normal") - PRIORIDADES.indexOf(x.prioridad||"Normal"));
  return ord({
    hoy: p.filter(t => t.fecha && t.fecha <= d), manana: p.filter(t => t.fecha === man), semana: p.filter(t => t.fecha && t.fecha >= d && t.fecha <= fs),
    proximas: p.filter(t => t.fecha && t.fecha > d), atrasadas: p.filter(t => t.fecha && t.fecha < d), sinfecha: p.filter(t => !t.fecha),
    completadas: vivos("tareas").filter(t => t.estado === "hecha").sort((a,b)=>(b.completada||"").localeCompare(a.completada||"")).slice(0,200), todas: p, tablero: p
  }[v] || []);
}
function vTareas(){
  const v = UI.tareas;
  const vs = [["hoy","Hoy"],["manana","Mañana"],["semana","Esta semana"],["proximas","Próximas"],["atrasadas","Atrasadas"],["sinfecha","Sin fecha"],["todas","Todas"],["completadas","Completadas"],["tablero","Tablero"]];

  for (const [k, re] of reglas) if (re.test(n)) return k;

function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, "");
  const primera = txt.split(/\r?\n/)[0] || "";
  const sep = [["\t",(primera.match(/\t/g)||[]).length],[";",(primera.match(/;/g)||[]).length],[",",(primera.match(/,/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const filas = []; let fila = [], cel = "", q = false;
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (q){ if (c === '"'){ if (txt[i+1] === '"'){ cel += '"'; i++; } else q = false; } else cel += c; }
    else if (c === '"') q = true;
    else if (c === sep){ fila.push(cel); cel = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && txt[i+1] === "\n") i++; fila.push(cel); filas.push(fila); fila = []; cel = ""; }
    else cel += c;
  }
  if (cel || fila.length){ fila.push(cel); filas.push(fila); }
  return filas.filter(f => f.some(x => String(x).trim()));
}

function construirImport(I){
  const cab = I.filas[0], idx = k => I.map.indexOf(k);
  const get = (f, k) => { const i = idx(k); return i >= 0 ? String(f[i] ?? "").trim() : ""; };
  const existentes = new Set(vivos("trabajos").map(t => norm(t.nombre) + "|" + (t.fecha||"")));
  const vistos = new Set(), clientesNuevos = {}, filas = [];
  const cliIdx = {}; vivos("clientes").forEach(c => cliIdx[norm(c.nombre).replace(/\b(cd|sd|ud|club|sl|sa)\b/g,"").trim()] = c);
  I.filas.slice(1).forEach((f, n) => {
    const r = {n: n+2, err: [], aviso: []};
    r.nombre = get(f, "nombre");
    r.clienteTxt = get(f, "cliente");
    if (!r.nombre) r.nombre = [r.clienteTxt, get(f,"tipo"), get(f,"fecha")].filter(Boolean).join(" · ");
    if (!r.nombre) { r.err.push("sin nombre"); }
    r.fecha = parseFecha(get(f, "fecha")); if (get(f,"fecha") && !r.fecha) r.err.push("fecha no válida");
    r.fechaEntrega = parseFecha(get(f, "fechaEntrega"));
    const iva = idx("iva") >= 0 && get(f,"iva") !== "" ? parseNum(get(f,"iva")) : +I.ivaDef;
    const irpf = idx("irpf") >= 0 && get(f,"irpf") !== "" ? parseNum(get(f,"irpf")) : +I.irpfDef;
    r.iva = isNaN(iva) ? 21 : (iva < 1 && iva > 0 ? iva*100 : iva); r.irpf = isNaN(irpf) ? 0 : (irpf < 1 && irpf > 0 ? irpf*100 : irpf);
    let precio = parseNum(get(f, "precio"));
    if (isNaN(precio) && idx("total") >= 0){ const tot = parseNum(get(f,"total")); if (!isNaN(tot)) precio = tot / (1 + r.iva/100); }
    r.precio = isNaN(precio) ? 0 : Math.round(precio*100)/100;
    const est = get(f, "estado");
    r.estado = est && I.est[est] ? I.est[est] : (r.fecha && r.fecha < hoy() ? "Finalizado" : "Confirmado");
    const ec = I.cob[get(f, "estadoCobro")] || "";
    const cobradoTxt = get(f, "cobrado"), cobradoN = parseNum(cobradoTxt);
    const factor = 1 + (r.iva - r.irpf)/100;
    const siCobrado = /^(si|sí|x|ok|pagado|cobrado|pagada|cobrada)$/i.test(cobradoTxt);
    r.cobrado = !isNaN(cobradoN) && cobradoN > 0 ? cobradoN : (ec === "cobrado" || siCobrado) ? Math.round(r.precio*factor*100)/100 : 0;
    r.fechaCobro = parseFecha(get(f, "fechaCobro")) || (r.cobrado ? (r.fecha || hoy()) : "");
    r.factura = get(f, "factura"); r.fechaFactura = parseFecha(get(f, "fechaFactura")) || r.fecha || hoy();
    r.facturar = !!(r.factura || ec === "facturado" || ec === "cobrado" || r.cobrado > 0) && r.precio > 0;
    r.noFacturable = ec === "nofact";
    r.tipo = get(f, "tipo"); r.ubicacion = get(f, "ubicacion"); r.campana = get(f, "campana"); r.descripcion = get(f, "descripcion");

    r.notas = notas.filter(Boolean).join("\n");
    r.etiquetas = ["importado-sheets"].concat(get(f,"etiqueta") ? [get(f,"etiqueta")] : []);
    if (r.clienteTxt){ const k = norm(r.clienteTxt).replace(/\b(cd|sd|ud|club|sl|sa)\b/g,"").trim(); r.clienteKey = k; if (cliIdx[k]) r.clienteId = cliIdx[k].id; else { clientesNuevos[k] = clientesNuevos[k] || {nombre: r.clienteTxt, n:0}; clientesNuevos[k].n++; } }
    const key = norm(r.nombre) + "|" + r.fecha;
    if (existentes.has(key)) r.dup = "ya existe en la app"; else if (vistos.has(key)) r.dup = "repetida en el archivo";

    if (cobradoTxt && isNaN(cobradoN) && !siCobrado && !/^no$/i.test(cobradoTxt)) r.aviso.push("cobrado no numérico");
    r.incluir = !r.err.length && !r.dup;
    filas.push(r);
  });
  return {filas, clientesNuevos};
}

function resultados(q){
  const n = norm(q), box = $("#res-busc"); if (!n){ box.innerHTML = ""; return; }
  const m = s => norm(s).includes(n);
  const g = [];
  const ts = vivos("trabajos").filter(t => m([t.nombre, t.campana, t.ubicacion, t.descripcion, t.notas, (t.etiquetas||[]).join(" "), (t.enlaces||[]).map(l=>l.valor).join(" "), (t.notasLista||[]).map(x=>x.texto).join(" "), (t.entregables||[]).map(e=>e.nombre).join(" ")].join(" "))).slice(0, 8);
  if (ts.length) g.push(["Trabajos", ts.map(t => `<a href="#trabajo-${esc(t.id)}" data-a="cerrarIr">${esc(t.nombre)}<small>${esc(nombreCliente(t.clienteId))} · ${esc(t.estado)}</small></a>`)]);
  const cs = vivos("clientes").filter(c => m([c.nombre, c.contacto, c.email, c.telefono, c.localidad, c.notas].join(" "))).slice(0, 6);
  if (cs.length) g.push(["Clientes", cs.map(c => `<a href="#cliente-${esc(c.id)}" data-a="cerrarIr">${esc(c.nombre)}<small>${esc(c.contacto||"")}</small></a>`)]);
  const tas = vivos("tareas").filter(t => m([t.nombre, t.descripcion].join(" "))).slice(0, 6);
  if (tas.length) g.push(["Tareas", tas.map(t => `<a data-a="editarTarea" data-id="${esc(t.id)}">${esc(t.nombre)}<small>${t.estado==="hecha"?"hecha":t.fecha?esc(fF(t.fecha)):""}</small></a>`)]);
  const ev = vivos("eventos").filter(e => m([e.titulo, e.ubicacion, e.notas].join(" "))).slice(0, 5);
  if (ev.length) g.push(["Eventos", ev.map(e => `<a data-a="editarEvento" data-id="${esc(e.id)}">${esc(e.titulo)}<small>${esc(fF(e.fecha))}</small></a>`)]);
  const fs = vivos("facturas").filter(f => m(f.numero)).slice(0, 5);
  if (fs.length) g.push(["Facturas", fs.map(f => `<a data-a="editarFactura" data-id="${esc(f.id)}">Nº ${esc(f.numero)}<small>${esc((porId("trabajos",f.trabajoId)||{}).nombre||"")}</small></a>`)]);
  const bs = vivos("bandeja").filter(b => m(b.texto)).slice(0, 5);
  if (bs.length) g.push(["Bandeja", bs.map(b => `<a href="#bandeja" data-a="cerrarIr">${esc(b.texto)}</a>`)]);
  box.innerHTML = g.length ? g.map(([t, l]) => `<div class="g">${t}</div>${l.join("")}`).join("") : `<div class="vacio">Sin resultados</div>`;
}

function exportarCSV(nombre, filas){

    else guardarCfg({ivaDef: parseNum($("#aj-iva").value) || 0, irpfDef: parseNum($("#aj-irpf").value) || 0, plazoPago: parseInt($("#aj-plazo").value) || 30, automatismos: $("#aj-auto").checked});
    toast("Ajustes guardados"); },
  ajGuardarPlantilla: d => { const ps = JSON.parse(JSON.stringify(cfg().plantillas)); const p = ps[+d.i]; p.nombre = $(`[data-pl-nombre="${d.i}"]`).value.trim() || p.nombre; p.tareas = $(`[data-pl="${d.i}"]`).value.split("\n").map(s => s.split("|").map(x => x.trim())).filter(x => x[0]).map(([t, n]) => [t, parseInt(n) || 0]); guardarCfg({plantillas:ps}); toast("Plantilla guardada"); },
  ajBorrarPlantilla: d => confirmar("¿Quitar esta plantilla?", "Los trabajos ya creados no cambian.", () => { const ps = JSON.parse(JSON.stringify(cfg().plantillas)); ps.splice(+d.i, 1); guardarCfg({plantillas:ps}); }),
  ajNuevaPlantilla: () => { const ps = JSON.parse(JSON.stringify(cfg().plantillas)); ps.push({id:"p-"+uid(), nombre:"Nueva plantilla", tipo:"", tareas:[["Preparación",-1],["Trabajo",0],["Entrega",3]]}); guardarCfg({plantillas:ps}); }
};
function cerrarModalSi(){ if (!$("#velo").hidden) cerrarModal(); }
function confirmar(titulo, texto, fn){
  abrirModal({titulo, cuerpo:`<p style="margin:0">${esc(texto)}</p>`, pie:`<button type="button" class="btn" data-a="cerrar">Cancelar</button><button class="btn rojo">Sí, adelante</button>`, async alGuardar(){ await fn(); }});
}

/* ============ eventos del DOM ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (el.tagName === "A" && el.getAttribute("href") && !["cerrarIr","vistaTareas","tab","abrirCampana"].includes(a)) return;
  if (!A[a]) return;
  if (a === "cerrarIr") { cerrarModal(); return; }
  if (el.tagName === "A") e.preventDefault();
  e.stopPropagation();
  const enModal = el.closest("#velo");
  const abreModal = /^(nuevo|editar|entregable|enlace|duplicar|aplicar|conv|ver|borrarTrabajo|borrarCliente|eliminar|vaciar|deshacer|ajBorrar|notaRapida|crear|buscar)/.test(a);
  if (enModal && abreModal && !["cerrar"].includes(a)) { $("#velo").hidden = true; $("#velo").innerHTML = ""; modalCtx = null; }
  try { await A[a](el.dataset, el); } catch(err){ console.error(err); toast("Algo ha fallado: " + err.message); }
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#velo").hidden) { cerrarModal(); return; }
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "/" ) { e.preventDefault(); buscar(); }
  else if (e.key === "n" || e.key === "N") { e.preventDefault(); menuCrear(); }
  else if ((e.key === "Enter" || e.key === " ") && e.target.matches(".buscador")) { e.preventDefault(); buscar(); }
});
$("#velo").addEventListener("mousedown", e => { if (e.target.id === "velo") cerrarModal(); });
document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  const k = f.dataset.f;
  if (k === "modal"){ if (!modalCtx) return; const btn = f.querySelector(".mf .pri,.mf .rojo"); if (btn) btn.disabled = true;
    try { const r = await modalCtx.alGuardar(); if (r !== false) cerrarModal(); else if (btn) btn.disabled = false; } catch(err){ console.error(err); toast("No se pudo guardar"); if (btn) btn.disabled = false; } return; }
  if (k === "login"){ const i = $("#clave"), m = $("#login-msg"); const btn = f.querySelector("button"); btn.disabled = true; m.textContent = "Comprobando…";
    try { const r = await api("login", {method:"POST", body: JSON.stringify({clave: i.value})}); API.token = r.token; stor.set("ks-token", r.token); i.blur(); m.textContent = ""; render(); await cargar(); }
    catch(e){ m.textContent = e.code === "clave" ? "Clave incorrecta." : e.code === "sin_clave" ? "Falta poner la clave en Netlify (variable KS_CLAVE)." : "No hay conexión con el servidor."; btn.disabled = false; }
    return; }
  if (k === "captura" || k === "capturaModal"){ const i = f.querySelector("input"); const t = i.value.trim(); if (!t) return; i.value = ""; const id = i.id; if (k === "captura") i.blur(); await guardar("bandeja", {texto:t}); toast("Guardado en la bandeja"); if (k === "capturaModal") cerrarModal(); else if (id === "cap-bandeja") setTimeout(() => { const n = $("#" + id); if (n) n.focus(); }, 80); return; }
  if (k === "tareaRapida"){ const i = $("#tarea-rapida"); const t = i.value.trim(); if (!t) return; i.value = ""; const fecha = UI.tareas === "hoy" ? hoy() : UI.tareas === "manana" ? sumaDias(hoy(),1) : ""; await guardar("tareas", {nombre:t, estado:"pendiente", prioridad:"Normal", fecha}); i.blur(); toast("Tarea creada"); return; }
  if (k === "nota"){ const tx = $("#nota-txt").value.trim(); if (!tx) return; const tt = JSON.parse(JSON.stringify(porId("trabajos", f.dataset.id))); tt.notasLista = tt.notasLista || []; tt.notasLista.push({id:uid(), tipo:$("#nota-tipo").value, texto:tx, f:new Date().toISOString()}); $("#nota-txt").value = ""; $("#nota-txt").blur(); await guardar("trabajos", tt); toast("Nota añadida"); }
});
document.addEventListener("change", async e => {
  const el = e.target, d = el.dataset;
  if (d.c){ const t = porId("trabajos", d.id); if (!t) return; let v = el.value; if (d.c === "precio"){ v = parseNum(v); if (isNaN(v)) v = ""; }
    el.blur(); await guardarTrabajo(Object.assign(JSON.parse(JSON.stringify(t)), {[d.c]: v})); return; }
  if (d.cchk){ el.blur(); await cambiar("trabajos", d.id, {[d.cchk]: el.checked}); return; }
  if (d.ce){ const tt = JSON.parse(JSON.stringify(porId("trabajos", d.t))); const en = tt.entregables.find(x => x.id === d.ce); en.estado = el.value; el.blur(); await guardarTrabajo(tt); return; }
  if (d.bk){ const t = porId("trabajos", d.id); const b = Object.assign({}, t.backup || {}); b[d.bk] = el.checked ? hoy() : ""; await cambiar("trabajos", d.id, {backup:b}); return; }
  if (d.ft !== undefined){ UI.trabajos.f[d.ft] = el.value; guardarUI(); el.blur(); render(); return; }
  if (d.fc !== undefined){ return; }
  if (d.capa){ UI.agenda.capas[d.capa] = el.checked ? 1 : 0; render(); return; }
  if (d.anio){ UI.dinero.anio = +el.value; el.blur(); render(); return; }
  if (d.impmap !== undefined){ UI.imp.map[+d.impmap] = el.value; el.blur(); if (["estado","estadoCobro"].includes(el.value)) A.impLeerValores(); render(); return; }
  if (d.impest !== undefined){ UI.imp.est[d.impest] = el.value; return; }
  if (d.impcob !== undefined){ UI.imp.cob[d.impcob] = el.value; return; }
  if (d.impinc !== undefined){ UI.imp.excl[d.impinc] = el.checked; const r = UI.imp.prev.filas.find(x => x.n === +d.impinc); if (r) r.incluir = el.checked; render(); return; }
});
A.impLeerValores = () => { const I = UI.imp; I.filas.slice(1).forEach(f => I.map.forEach((m, i) => { const v = String(f[i]||"").trim(); if (!v) return; if (m === "estado" && !(v in I.est)) I.est[v] = ""; if (m === "estadoCobro" && !(v in I.cob)) I.cob[v] = "pendiente"; })); };
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.fc !== undefined){ UI.qClientes = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render.esperando = false; el.blur(); render(); const n = $("#fc-q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  if (el.id === "ft-q"){ UI.trabajos.f.q = el.value; clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; el.blur(); render(); const n = $("#ft-q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }, 300); }
});
// arrastrar en tableros
document.addEventListener("dragstart", e => { const t = e.target.closest("[data-drag],[data-dragt]"); if (!t) return; e.dataTransfer.setData("text/plain", JSON.stringify({id: t.dataset.drag || t.dataset.dragt, tarea: !!t.dataset.dragt})); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", e => { const c = e.target.closest("[data-drop],[data-dropt]"); if (!c) return; e.preventDefault(); $$(".kcol.sobre").forEach(x => x !== c && x.classList.remove("sobre")); c.classList.add("sobre"); });
document.addEventListener("dragleave", e => { const c = e.target.closest(".kcol"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("sobre"); });
document.addEventListener("drop", async e => { const c = e.target.closest("[data-drop],[data-dropt]"); if (!c) return; e.preventDefault(); c.classList.remove("sobre");
  let d; try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(x){ return; }
  if (c.dataset.drop && !d.tarea){ const t = porId("trabajos", d.id); if (t && t.estado !== c.dataset.drop) await guardarTrabajo(Object.assign(JSON.parse(JSON.stringify(t)), {estado: c.dataset.drop})); }
  else if (c.dataset.dropt && d.tarea){ const t = porId("tareas", d.id); if (t){ const est = c.dataset.dropt; await cambiar("tareas", d.id, {estado: est, completada: est === "hecha" ? hoy() : ""}); } } });

function aplicarTema(){ const t = stor.get("ks-tema"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; }
render.esperando = false;
iniciar();
</script>
