<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Liceo Día de Partido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabecera fija con pestañas; columna central de 920px; tareas agrupadas en bloques por departamento o por momento del partido */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15211A; --muted:#5B685F; --line:#D9DFD7;
  --accent:#0E6A3A; --accent-ink:#FFFFFF; --accent-soft:#E2EFE6;
  --warn:#9A5E00; --warn-soft:#FBF0DA; --danger:#B3261E; --done:#2E7A4C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#162019; --ink:#E6ECE7; --muted:#98A69C; --line:#29352E;
  --accent:#4FC482; --accent-ink:#0B1A11; --accent-soft:#1B3325;
  --warn:#E8AE52; --warn-soft:#33291A; --danger:#F08A80; --done:#5FCB8C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#162019; --ink:#E6ECE7; --muted:#98A69C; --line:#29352E;
  --accent:#4FC482; --accent-ink:#0B1A11; --accent-soft:#1B3325;
  --warn:#E8AE52; --warn-soft:#33291A; --danger:#F08A80; --done:#5FCB8C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.marca{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(28px,6vw,40px)} h2{font-size:24px} h3{font-size:19px}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.aviso{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:15px}
.vacio{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
/* lista de partidos */
.partidos{display:grid;gap:10px;margin-top:16px}
.partido{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit}
.partido:hover{border-color:var(--accent)}
.partido.prox{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fecha-blq{width:62px;text-align:center;font-family:var(--display);line-height:1}
.fecha-blq b{display:block;font-size:30px;font-weight:700}
.fecha-blq span{font-size:14px;text-transform:uppercase;color:var(--muted);font-weight:600}
.partido .vs{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.1}
.partido .meta{font-size:14px;color:var(--muted)}
.prog{min-width:90px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted)}
.barra{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--done)}
.tag-prox{display:inline-block;font-family:var(--mono);font-size:11px;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;margin-bottom:4px}
.sec-tit{margin-top:32px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* cabecera de partido */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.ficha .datos{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:15px}
.ficha .datos b{font-family:var(--mono);font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:6px}
.herr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;width:100%}
select.sel{width:auto;max-width:100%}
textarea.inp{min-height:84px;resize:vertical}
/* grupos de tareas */
.grupo{margin-top:22px}
.grupo-cab{display:flex;align-items:center;gap:10px;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:10px}
.grupo-cab .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tareas{display:grid;gap:8px}
.tarea{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tarea .t-body{min-width:0;display:grid;gap:6px}
.tarea h4{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.tarea.est-hecho h4{text-decoration:line-through;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:700;padding:0}
.check:hover{border-color:var(--done)}
.est-hecho .check{background:var(--done);border-color:var(--done);color:var(--surface)}
.est-curso .check{border-color:var(--warn);border-style:dashed}
.etiq{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.lbl.curso{color:var(--warn);border-color:var(--warn)}
.det{margin:0;white-space:pre-line;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.dudas{margin:0;white-space:pre-line;font-size:14px;background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:6px}
.dudas::before{content:"Duda: ";font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 10px 2px 2px;font-size:14px;font-weight:500;text-decoration:none;border:0;cursor:pointer}
.chip .ini{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:600}
.chip.sin{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:2px 10px;cursor:default}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.balance label{display:grid;gap:6px;font-weight:600}
/* por persona */
.personas-sel{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.psel{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.psel .ini{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.psel[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.psel[aria-pressed="true"] .ini{background:var(--accent-ink);color:var(--accent)}
.psel .n{font-family:var(--mono);font-size:12px;opacity:.75}
.filtros{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px;align-items:center}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ptarea-partido{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* ajustes */
.tabla{display:grid;gap:8px;margin-top:12px}
.fila{display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;align-items:center}
.fila.dep{grid-template-columns:auto 1fr auto auto}
/* modal */
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.55);display:grid;place-items:start center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal-bg[hidden]{display:none}
.modal{width:min(620px,100%);background:var(--surface);border-radius:14px;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.modal label.f{display:grid;gap:5px;font-weight:600;font-size:14px}
.modal .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;font-weight:500}
.pick input{accent-color:var(--accent)}
.pick label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.modal .pie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30}
.toast[hidden]{display:none}
@media (max-width:640px){
  .partido{grid-template-columns:auto 1fr}
  .prog{grid-column:1/-1;text-align:left}
  .balance,.modal .dos,.filtros{grid-template-columns:1fr}
  .fila{grid-template-columns:1fr 1fr auto}
  .tarea{grid-template-columns:auto 1fr}
  .tarea .t-acts{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top"><div class="wrap">
  <a class="marca" href="#partidos"><i></i>Día de partido</a>
  <nav class="tabs" aria-label="Secciones">
    <a href="#partidos" data-tab="partidos">Partidos</a>
    <a href="#plantilla" data-tab="plantilla">Tareas fijas</a>
    <a href="#ajustes" data-tab="ajustes">Equipo y áreas</a>
  </nav>
</div></header>

<main class="wrap" id="app">
  <div class="vacio" id="cargando">Cargando partidos, tareas y equipo…</div>
</main>

<div class="modal-bg" id="modal" hidden><form class="modal" id="modal-form" autocomplete="off"></form></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const MOMENTOS=["Preparación","Previa","Durante el partido","Descanso y tiempos muertos","Postpartido"];
const ESTADOS={pendiente:"Pendiente",curso:"En curso",hecho:"Hecha"};
const S={personas:[],deps:[],partidos:[],tareas:[],cargado:{},db:null,puede:true,error:null,ui:{}};
try{S.ui=JSON.parse(localStorage.getItem("dp-ui")||"{}")}catch(e){}
function guardaUI(){try{localStorage.setItem("dp-ui",JSON.stringify(S.ui))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nid=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ini=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const persona=id=>S.personas.find(p=>p.id===id);
const dep=id=>S.deps.find(d=>d.id===id);
const partido=id=>S.partidos.find(p=>p.id===id);
const nombrePartido=p=>p?`${p.local||"HC Liceo"} – ${p.visitante||"?"}`:"";
function fmtFecha(f,corto){if(!f)return"Sin fecha";const d=new Date(f+"T12:00:00");return d.toLocaleDateString("es-ES",corto?{day:"numeric",month:"short"}:{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function partidosOrdenados(){
  const h=hoy();
  const fut=S.partidos.filter(p=>(p.fecha||"9")>=h).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const pas=S.partidos.filter(p=>(p.fecha||"9")<h).sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  return{fut,pas};
}
function tareasDe(pid){return S.tareas.filter(t=>t.partido===pid)}
function ordenTareas(a,b){return (MOMENTOS.indexOf(a.momento)-MOMENTOS.indexOf(b.momento))||((a.orden||0)-(b.orden||0))}

/* ---------- escritura ---------- */
async function escribe(fn,ok){
  if(!S.db){toast("Sin conexión con los datos");return false}
  try{await fn(S.db);if(ok)toast(ok);return true}
  catch(e){
    if(e&&e.code==="invalid_argument"&&!S.puedeConfirmado){S.puede=false;render();toast("Tienes acceso solo de lectura");}
    else toast(e&&e.code==="quota_exceeded"?"No caben más datos: borra partidos viejos":"No se pudo guardar. Inténtalo de nuevo.");
    return false;
  }
}
const setDoc=(col,id,data,ok)=>escribe(db=>db.doc(col+"/"+id).set(data),ok);
const updDoc=(col,id,data,ok)=>escribe(db=>db.doc(col+"/"+id).update(data),ok);
const delDoc=(col,id,ok)=>escribe(db=>db.doc(col+"/"+id).delete(),ok);

/* ---------- piezas ---------- */
function chipPersona(id){const p=persona(id);if(!p)return"";return `<button type="button" class="chip" data-act="fp" data-v="${esc(id)}" title="Ver solo sus tareas en este partido"><span class="ini">${esc(ini(p.nombre))}</span>${esc(p.nombre)}</button>`}
function tareaHTML(t,opt={}){
  const ro=!S.puede;
  const d=dep(t.departamento);
  const pers=(t.personas||[]).filter(persona);
  return `<article class="tarea est-${esc(t.estado||"pendiente")}">
    <button type="button" class="check" data-act="toggle" data-id="${esc(t.id)}" aria-label="${t.estado==="hecho"?"Marcar como pendiente":"Marcar como hecha"}" ${ro?"disabled":""}>✓</button>
    <div class="t-body">
      ${opt.partido?`<div class="ptarea-partido">${esc(opt.partido)}</div>`:""}
      <h4>${esc(t.titulo)}</h4>
      <div class="etiq">
        ${opt.mostrarDep&&d?`<span class="lbl">${esc(d.nombre)}</span>`:""}
        ${opt.mostrarMom!==false&&t.momento?`<span class="lbl">${esc(t.momento)}</span>`:""}
        ${t.estado==="curso"?`<span class="lbl curso">En curso</span>`:""}
      </div>
      ${t.detalle?`<p class="det">${esc(t.detalle)}</p>`:""}
      ${t.dudas?`<p class="dudas">${esc(t.dudas)}</p>`:""}
      <div class="chips">${pers.length?pers.map(p=>chipPersona(p.id)).join(""):`<span class="chip sin">Sin asignar</span>`}</div>
    </div>
    ${ro?"":`<div class="t-acts"><button type="button" class="btn sm ghost" data-act="edit-tarea" data-id="${esc(t.id)}">Editar</button></div>`}
  </article>`;
}
function progreso(ts){const h=ts.filter(t=>t.estado==="hecho").length;return{h,n:ts.length,pct:ts.length?Math.round(h/ts.length*100):0}}

/* ---------- vistas ---------- */
function vistaPartidos(){
  const{fut,pas}=partidosOrdenados();
  const card=(p,prox)=>{const pr=progreso(tareasDe(p.id));const d=p.fecha?new Date(p.fecha+"T12:00:00"):null;
    return `<a class="partido ${prox?"prox":""}" href="#partido-${esc(p.id)}">
      <div class="fecha-blq"><b>${d?d.getDate():"–"}</b><span>${d?d.toLocaleDateString("es-ES",{month:"short"}).replace(".",""):""}</span></div>
      <div>${prox?`<span class="tag-prox">Próximo</span>`:""}<div class="vs">${esc(nombrePartido(p))}</div>
        <div class="meta">${esc([p.competicion,p.hora&&p.hora+" h",p.lugar].filter(Boolean).join(" · "))}</div></div>
      <div class="prog">${pr.h}/${pr.n} hechas<div class="barra"><i style="width:${pr.pct}%"></i></div></div></a>`};
  return `<div class="row" style="justify-content:space-between">
      <div><div class="eyebrow">Temporada</div><h1>Partidos</h1></div>
      ${S.puede?`<button class="btn pri" data-act="nuevo-partido">+ Nuevo partido</button>`:""}
    </div>
    ${!S.partidos.length?`<div class="vacio" style="margin-top:16px">Aún no hay partidos. ${S.puede?"Pulsa «+ Nuevo partido» para dar de alta el primero.":""}</div>`:""}
    ${fut.length?`<div class="partidos">${fut.map((p,i)=>card(p,i===0)).join("")}</div>`:""}
    ${pas.length?`<div class="sec-tit"><h2>Jugados</h2></div><div class="partidos">${pas.map(p=>card(p,false)).join("")}</div>`:""}`;
}

function bloquesTareas(ts,modo,opt={}){
  if(!ts.length)return `<div class="vacio" style="margin-top:16px">${opt.vacio||"No hay tareas."}</div>`;
  let grupos=[];
  if(modo==="momento"){
    const usados=[...MOMENTOS,...new Set(ts.map(t=>t.momento).filter(m=>!MOMENTOS.includes(m)))];
    grupos=usados.map(m=>({k:m,nombre:m||"Sin momento",ts:ts.filter(t=>(t.momento||"")===m)}));
    const sinM=ts.filter(t=>!t.momento);if(sinM.length)grupos.push({k:"",nombre:"Sin momento",ts:sinM});
  }else{
    const ds=[...S.deps].sort((a,b)=>(a.orden||0)-(b.orden||0));
    grupos=ds.map(d=>({k:d.id,nombre:d.nombre,ts:ts.filter(t=>t.departamento===d.id)}));
    const sinD=ts.filter(t=>!dep(t.departamento));if(sinD.length)grupos.push({k:"",nombre:"Sin departamento",ts:sinD});
  }
  return grupos.filter(g=>g.ts.length).map(g=>{const pr=progreso(g.ts);return `<section class="grupo">
    <div class="grupo-cab"><h3>${esc(g.nombre)}</h3><div class="row"><span class="cnt">${pr.h}/${pr.n}</span>
      ${S.puede&&opt.pid?`<button class="btn sm" data-act="nueva-tarea" data-pid="${esc(opt.pid)}" data-${modo==="momento"?"mom":"dep"}="${esc(g.k)}">+ Tarea</button>`:""}</div></div>
    <div class="tareas">${g.ts.sort(ordenTareas).map(t=>tareaHTML(t,{mostrarDep:modo==="momento",mostrarMom:modo!=="momento"})).join("")}</div></section>`}).join("");
}

S.ui.fp=S.ui.fp||{};S.qs={};
const fP=pid=>{const v=S.ui.fp[pid]||"";return v==="_sin"||persona(v)?v:""};
function herramientas(pid,ts){
  const modo=S.ui.modo||"dep";
  const ids=[...new Set(ts.flatMap(t=>t.personas||[]))].filter(persona).sort((a,b)=>persona(a).nombre.localeCompare(persona(b).nombre));
  const f=fP(pid);
  const pend=id=>ts.filter(t=>(t.personas||[]).includes(id)&&t.estado!=="hecho").length;
  const sinN=ts.filter(t=>!(t.personas||[]).some(persona)).length;
  const pSel=f&&f!=="_sin"?persona(f):null;
  return `<div class="sec-tit"><h2>Quién hace qué</h2><span class="muted">Toca un nombre para ver solo sus tareas en este partido</span></div>
  <div class="personas-sel" role="group" aria-label="Filtrar por persona">
    <button type="button" class="psel" data-act="fp" data-v="" aria-pressed="${!f}">Todas</button>
    ${ids.map(id=>`<button type="button" class="psel" data-act="fp" data-v="${esc(id)}" aria-pressed="${f===id}"><span class="ini">${esc(ini(persona(id).nombre))}</span>${esc(persona(id).nombre)} <span class="n" title="Pendientes">${pend(id)}</span></button>`).join("")}
    ${sinN?`<button type="button" class="psel" data-act="fp" data-v="_sin" aria-pressed="${f==="_sin"}">Sin asignar <span class="n">${sinN}</span></button>`:""}
  </div>
  ${pSel?`<p class="aviso" style="margin:14px 0 0;background:var(--accent-soft);color:var(--ink)">Viendo las tareas de <b>${esc(pSel.nombre)}</b>${pSel.rol?" ("+esc(pSel.rol)+")":""} en este partido: ${pend(f)} pendientes. <button type="button" class="btn sm ghost" data-act="fp" data-v="">Ver todas</button></p>`:""}
  <div class="herr">
    <input class="inp" id="buscar" type="search" placeholder="Buscar en este partido…" value="${esc(S.qs[pid]||"")}" style="flex:1 1 220px;width:auto">
    <div class="seg" role="group" aria-label="Agrupar tareas">
      <button type="button" data-act="modo" data-v="dep" aria-pressed="${modo==="dep"}">Por departamento</button>
      <button type="button" data-act="modo" data-v="momento" aria-pressed="${modo==="momento"}">Por momento</button>
    </div>
    ${S.puede?`<button class="btn pri" data-act="nueva-tarea" data-pid="${esc(pid)}">+ Nueva tarea</button>`:""}
  </div>`;
}
function filtraP(ts,pid){
  const f=fP(pid);
  if(f==="_sin")ts=ts.filter(t=>!(t.personas||[]).some(persona));
  else if(f)ts=ts.filter(t=>(t.personas||[]).includes(f));
  const q=(S.qs[pid]||"").trim().toLowerCase();
  if(q)ts=ts.filter(t=>{const d=dep(t.departamento);return [t.titulo,t.detalle,t.dudas,t.momento,d&&d.nombre,...(t.personas||[]).map(i=>persona(i)?.nombre)].join(" ").toLowerCase().includes(q)});
  return ts;
}
const pidActual=()=>{const r=ruta();return r==="plantilla"?"plantilla":r.startsWith("partido-")?r.slice(8):""};

function vistaPartido(id){
  const p=partido(id);
  if(!p)return S.cargado.partidos?`<div class="vacio">Este partido ya no existe. <a href="#partidos">Volver a partidos</a></div>`:`<div class="vacio">Cargando…</div>`;
  const ts=tareasDe(id);const pr=progreso(ts);
  return `<p><a href="#partidos" class="muted">← Partidos</a></p>
  <div class="ficha">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><div class="eyebrow">${esc(p.competicion||"Partido")}</div><h1>${esc(nombrePartido(p))}</h1></div>
      ${S.puede?`<button class="btn sm" data-act="edit-partido" data-id="${esc(id)}">Editar partido</button>`:""}
    </div>
    <div class="datos">
      <span><b>Fecha</b>${esc(fmtFecha(p.fecha))}</span>
      ${p.hora?`<span><b>Hora</b>${esc(p.hora)} h</span>`:""}
      ${p.lugar?`<span><b>Lugar</b>${esc(p.lugar)}</span>`:""}
    </div>
    ${p.notas?`<p class="det">${esc(p.notas)}</p>`:""}
    <div><div class="row" style="justify-content:space-between"><span class="eyebrow">Preparación</span><span class="eyebrow">${pr.h} de ${pr.n} tareas hechas</span></div><div class="barra"><i style="width:${pr.pct}%"></i></div></div>
  </div>
  ${herramientas(id,ts)}
  ${bloquesTareas(filtraP(ts,id),S.ui.modo||"dep",{pid:id,vacio:fP(id)||S.qs[id]?"No hay tareas con este filtro en este partido.":"Este partido aún no tiene tareas."+(S.puede?" Añade la primera con «+ Nueva tarea».":"")})}
  <section class="grupo"><div class="grupo-cab"><h3>Balance del partido</h3></div>
    <div class="balance">
      <label>Mejoras<textarea class="inp" id="bal-mejoras" data-pid="${esc(id)}" ${S.puede?"":"readonly"} placeholder="Qué falló o hay que cambiar para el próximo">${esc(p.mejoras||"")}</textarea></label>
      <label>Aspectos positivos<textarea class="inp" id="bal-positivos" data-pid="${esc(id)}" ${S.puede?"":"readonly"} placeholder="Qué salió bien">${esc(p.positivos||"")}</textarea></label>
    </div>
    ${S.puede?`<p class="muted" style="font-size:14px;margin:6px 0 0">Se guarda solo al salir del cuadro.</p>`:""}
  </section>`;
}

function vistaPlantilla(){
  const ts=tareasDe("plantilla");
  return `<div class="eyebrow">Se repiten en cada partido</div><h1>Tareas fijas</h1>
  <p class="muted" style="max-width:62ch">Lo que hay que hacer en todos los partidos. Al dar de alta un partido nuevo puedes copiarlas de golpe; después cada partido lleva su propia copia y se marca por separado.</p>
  ${herramientas("plantilla",ts)}
  ${bloquesTareas(filtraP(ts,"plantilla"),S.ui.modo||"dep",{pid:"plantilla",vacio:fP("plantilla")||S.qs.plantilla?"No hay tareas fijas con este filtro.":"No hay tareas fijas todavía."})}`;
}

function vistaAjustes(){
  const ro=S.puede?"":"readonly";
  const ps=[...S.personas].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const ds=[...S.deps].sort((a,b)=>(a.orden||0)-(b.orden||0));
  const usoD=id=>S.tareas.filter(t=>t.departamento===id).length;
  const usoP=id=>S.tareas.filter(t=>(t.personas||[]).includes(id)).length;
  return `<div class="row" style="justify-content:space-between"><h1>Equipo y áreas</h1>
    <span class="row"><span class="muted" style="font-size:14px">${S.rol==="editor"?"Has entrado con la clave de edición":"Has entrado con la clave del equipo (solo lectura)"}</span><button class="btn sm" data-act="salir">Cambiar de clave</button></span></div>
  <div class="sec-tit"><h2>Personas</h2><span class="muted">${ps.length} en el equipo</span></div>
  <p class="muted" style="margin:4px 0 0">Los cambios se guardan al salir de cada casilla.</p>
  <div class="tabla">
    ${ps.map(p=>`<div class="fila">
      <input class="inp" id="pn-${esc(p.id)}" data-col="personas" data-id="${esc(p.id)}" data-f="nombre" value="${esc(p.nombre)}" aria-label="Nombre" ${ro}>
      <input class="inp" id="pr-${esc(p.id)}" data-col="personas" data-id="${esc(p.id)}" data-f="rol" value="${esc(p.rol||"")}" placeholder="Función" aria-label="Función" ${ro}>
      ${S.puede?`<button class="btn sm danger" data-act="borrar" data-col="personas" data-id="${esc(p.id)}" title="${usoP(p.id)} tareas asignadas">Quitar</button>`:""}
    </div>`).join("")}
    ${S.puede?`<div class="fila"><input class="inp" id="np-nombre" placeholder="Nombre nuevo"><input class="inp" id="np-rol" placeholder="Función"><button class="btn sm pri" data-act="add-persona">Añadir</button></div>`:""}
  </div>
  <div class="sec-tit"><h2>Departamentos y áreas</h2><span class="muted">El orden es el de la ficha del partido</span></div>
  <div class="tabla">
    ${ds.map((d,i)=>`<div class="fila dep">
      <span class="eyebrow" style="width:2ch">${i+1}</span>
      <input class="inp" id="dn-${esc(d.id)}" data-col="departamentos" data-id="${esc(d.id)}" data-f="nombre" value="${esc(d.nombre)}" aria-label="Nombre del departamento" ${ro}>
      ${S.puede?`<span class="row" style="gap:4px"><button class="btn sm ghost" data-act="subir" data-id="${esc(d.id)}" aria-label="Subir" ${i===0?"disabled":""}>↑</button><button class="btn sm ghost" data-act="bajar" data-id="${esc(d.id)}" aria-label="Bajar" ${i===ds.length-1?"disabled":""}>↓</button></span>
      <button class="btn sm danger" data-act="borrar" data-col="departamentos" data-id="${esc(d.id)}" title="${usoD(d.id)} tareas">Quitar</button>`:""}
    </div>`).join("")}
    ${S.puede?`<div class="fila dep"><span></span><input class="inp" id="nd-nombre" placeholder="Nuevo departamento o área"><span></span><button class="btn sm pri" data-act="add-dep">Añadir</button></div>`:""}
  </div>`;
}

/* ---------- router y render ---------- */
function ruta(){const h=decodeURIComponent(location.hash.slice(1));return h||"partidos"}
function vistaClave(){return `<form id="form-clave" class="ficha" style="max-width:440px;margin:32px auto" autocomplete="on">
    <div class="eyebrow">HC Liceo</div><h1>Día de partido</h1>
    <p class="muted" style="margin:0">Escribe la clave que te pasó el club para ver los partidos y tus tareas.</p>
    ${S.claveMal?`<p class="aviso" style="margin:0">Esa clave no es correcta. Revísala o pídesela de nuevo a quien organiza.</p>`:""}
    <input class="inp" id="clave" type="password" autocomplete="current-password" placeholder="Clave" required>
    <button class="btn pri" type="submit">Entrar</button></form>`}
function render(){
  if(S.pideClave){$("#app").innerHTML=vistaClave();const c=$("#clave");if(c)c.focus();return}
  const r=ruta();
  const tab=r.startsWith("partido")?"partidos":r.startsWith("persona")?"personas":r;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const listo=S.cargado.partidos&&S.cargado.tareas&&S.cargado.personas&&S.cargado.departamentos;
  let html="";
  if(S.error)html=`<div class="aviso" style="margin-bottom:16px">${esc(S.error)}</div>`;
  if(!S.puede&&listo)html+=`<div class="aviso" style="margin-bottom:16px">Estás en modo lectura: puedes consultar y filtrar, pero no cambiar tareas.</div>`;
  if(!listo&&!S.error){html+=`<div class="vacio">Cargando partidos, tareas y equipo…</div>`}
  else if(r.startsWith("partido-"))html+=vistaPartido(r.slice(8));
  else if(r==="plantilla")html+=vistaPlantilla();
  else if(r==="ajustes")html+=vistaAjustes();
  else html+=vistaPartidos();
  const act=document.activeElement, actId=act&&act.id, selS=act&&act.selectionStart;
  $("#app").innerHTML=html;
  if(actId){const el=document.getElementById(actId);if(el){el.focus();try{if(selS!=null)el.setSelectionRange(selS,selS)}catch(e){}}}
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});

/* ---------- modal ---------- */
function abreModal(html,onSubmit){const f=$("#modal-form");f.innerHTML=html;f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("[type=submit]");if(b)b.disabled=true;const ok=await onSubmit(new FormData(f),f);if(b)b.disabled=false;if(ok!==false)cierraModal()};$("#modal").hidden=false;const p=f.querySelector("input,select,textarea");if(p)p.focus()}
function cierraModal(){$("#modal").hidden=true;$("#modal-form").innerHTML=""}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")cierraModal()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)cierraModal()});

function opcionesDeps(selId){return [...S.deps].sort((a,b)=>(a.orden||0)-(b.orden||0)).map(d=>`<option value="${esc(d.id)}" ${d.id===selId?"selected":""}>${esc(d.nombre)}</option>`).join("")}
function pickPersonas(sel){return [...S.personas].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=>`<label><input type="checkbox" name="personas" value="${esc(p.id)}" ${sel.includes(p.id)?"checked":""}>${esc(p.nombre)}</label>`).join("")}

function editorTarea(t,pid,pre={}){
  const nueva=!t;t=t||{partido:pid,departamento:pre.dep||"",momento:pre.mom||"Previa",personas:[],estado:"pendiente"};
  const p=partido(t.partido);
  abreModal(`<div><div class="eyebrow">${esc(t.partido==="plantilla"?"Tarea fija":nombrePartido(p))}</div><h2>${nueva?"Nueva tarea":"Editar tarea"}</h2></div>
    <label class="f">Qué hay que hacer<input class="inp" name="titulo" id="ft-titulo" required value="${esc(t.titulo||"")}" placeholder="Ej.: Acreditaciones Recuncho VIP"></label>
    <div class="dos">
      <label class="f">Departamento / área<select class="inp" name="departamento" id="ft-dep"><option value="">Sin departamento</option>${opcionesDeps(t.departamento)}</select></label>
      <label class="f">Momento<select class="inp" name="momento" id="ft-mom">${MOMENTOS.map(m=>`<option ${m===t.momento?"selected":""}>${m}</option>`).join("")}</select></label>
    </div>
    <div class="f" style="display:grid;gap:6px;font-weight:600;font-size:14px">Quién se encarga
      <div class="pick" id="ft-pick">${pickPersonas(t.personas||[])}</div>
      <div class="row" style="flex-wrap:nowrap"><input class="inp" id="ft-nuevaP" placeholder="¿No está? Escribe el nombre y pulsa Añadir"><button type="button" class="btn sm" data-act="quick-persona">Añadir</button></div>
    </div>
    <label class="f">Detalle<textarea class="inp" name="detalle" id="ft-det" placeholder="Instrucciones, horarios, contactos…">${esc(t.detalle||"")}</textarea></label>
    <label class="f">Dudas pendientes<textarea class="inp" name="dudas" id="ft-dudas" style="min-height:56px" placeholder="Lo que falta por confirmar">${esc(t.dudas||"")}</textarea></label>
    <label class="f">Estado<select class="inp" name="estado" id="ft-est">${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${k===(t.estado||"pendiente")?"selected":""}>${v}</option>`).join("")}</select></label>
    <div class="pie">
      ${nueva?"<span></span>":`<button type="button" class="btn danger" data-act="borrar" data-col="tareas" data-id="${esc(t.id)}" data-cerrar="1">Borrar tarea</button>`}
      <div class="row"><button type="button" class="btn" data-act="cerrar">Cancelar</button><button type="submit" class="btn pri">${nueva?"Crear tarea":"Guardar"}</button></div>
    </div>`,
  async fd=>{
    const data={partido:t.partido,titulo:fd.get("titulo").trim(),departamento:fd.get("departamento"),momento:fd.get("momento"),personas:fd.getAll("personas"),detalle:fd.get("detalle").trim(),dudas:fd.get("dudas").trim(),estado:fd.get("estado"),orden:t.orden||Date.now()};
    if(!data.titulo)return false;
    return await setDoc("tareas",nueva?nid("t"):t.id,data,nueva?"Tarea creada":"Guardado");
  });
}

function editorPartido(p){
  const nuevo=!p;p=p||{local:"HC Liceo",visitante:"",competicion:"",fecha:"",hora:"",lugar:"Palacio dos Deportes de Riazor",notas:""};
  const nFijas=tareasDe("plantilla").length;
  const otros=partidosOrdenados();const todos=[...otros.fut,...otros.pas].filter(x=>x.id!==p.id);
  abreModal(`<h2>${nuevo?"Nuevo partido":"Editar partido"}</h2>
    <div class="dos">
      <label class="f">Local<input class="inp" name="local" id="fp-local" required value="${esc(p.local)}"></label>
      <label class="f">Visitante<input class="inp" name="visitante" id="fp-vis" required value="${esc(p.visitante)}" placeholder="Ej.: Reus Deportiu"></label>
    </div>
    <label class="f">Competición / jornada<input class="inp" name="competicion" id="fp-comp" value="${esc(p.competicion)}" placeholder="Ej.: OK Liga · J6"></label>
    <div class="dos">
      <label class="f">Fecha<input class="inp" type="date" name="fecha" id="fp-fecha" required value="${esc(p.fecha)}"></label>
      <label class="f">Hora<input class="inp" type="time" name="hora" id="fp-hora" value="${esc(p.hora)}"></label>
    </div>
    <label class="f">Lugar<input class="inp" name="lugar" id="fp-lugar" value="${esc(p.lugar)}"></label>
    <label class="f">Notas generales<textarea class="inp" name="notas" id="fp-notas" placeholder="Puertas, horarios de llegada, avisos…">${esc(p.notas||"")}</textarea></label>
    ${nuevo?`<div class="stack" style="background:var(--accent-soft);padding:12px;border-radius:10px">
      <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" name="fijas" id="fp-fijas" ${nFijas?"checked":"disabled"}> Añadir las ${nFijas} tareas fijas</label>
      <label class="f">Copiar además las tareas de otro partido<select class="inp" name="copiar" id="fp-copiar"><option value="">No copiar</option>${todos.map(x=>`<option value="${esc(x.id)}">${esc(nombrePartido(x))} (${esc(fmtFecha(x.fecha,true))}) · ${tareasDe(x.id).length} tareas</option>`).join("")}</select></label>
      <span class="muted" style="font-size:14px">Las tareas copiadas empiezan como pendientes y las puedes cambiar después.</span></div>`:""}
    <div class="pie">
      ${nuevo?"<span></span>":`<button type="button" class="btn danger" data-act="borrar-partido" data-id="${esc(p.id)}">Borrar partido</button>`}
      <div class="row"><button type="button" class="btn" data-act="cerrar">Cancelar</button><button type="submit" class="btn pri">${nuevo?"Crear partido":"Guardar"}</button></div>
    </div>`,
  async fd=>{
    const data={...p};["local","visitante","competicion","fecha","hora","lugar","notas"].forEach(k=>data[k]=(fd.get(k)||"").trim());delete data.id;
    const id=nuevo?nid("p"):p.id;
    const ok=await setDoc("partidos",id,data,nuevo?"Partido creado":"Guardado");
    if(!ok)return false;
    if(nuevo){
      const copiar=[...(fd.get("fijas")?tareasDe("plantilla"):[]),...(fd.get("copiar")?tareasDe(fd.get("copiar")):[])];
      let n=Date.now();
      await escribe(db=>Promise.all(copiar.map(t=>{const c={...t};delete c.id;c.partido=id;c.estado="pendiente";c.orden=n++;return db.doc("tareas/"+nid("t")).set(c)})));
      location.hash="partido-"+id;
    }
  });
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="cerrar")return cierraModal();
  if(a==="salir"){guardaClave("");S.pideClave=true;S.claveMal=false;return render()}
  if(a==="nuevo-partido")return editorPartido();
  if(a==="edit-partido")return editorPartido(partido(id));
  if(a==="nueva-tarea")return editorTarea(null,b.dataset.pid,{dep:b.dataset.dep,mom:b.dataset.mom});
  if(a==="edit-tarea")return editorTarea(S.tareas.find(t=>t.id===id));
  if(a==="modo"){S.ui.modo=b.dataset.v;guardaUI();return render()}
  if(a==="fp"){const pid=pidActual();if(!pid)return;S.ui.fp[pid]=b.dataset.v;guardaUI();render();const h=document.querySelector(".personas-sel");if(h&&h.getBoundingClientRect().top<0)h.scrollIntoView({block:"start"});return}
  if(a==="toggle"){const t=S.tareas.find(x=>x.id===id);if(!t)return;return updDoc("tareas",id,{estado:t.estado==="hecho"?"pendiente":"hecho"})}
  if(a==="quick-persona"){const inp=$("#ft-nuevaP");const n=inp.value.trim();if(!n)return;const pid=nid("u");
    if(await setDoc("personas",pid,{nombre:n,rol:""})){const l=document.createElement("label");l.innerHTML=`<input type="checkbox" name="personas" value="${esc(pid)}" checked>${esc(n)}`;$("#ft-pick").append(l);inp.value=""}return}
  if(a==="borrar"||a==="borrar-partido"){
    if(!b.classList.contains("arm")){b.classList.add("arm");b.dataset.txt=b.textContent;b.textContent=a==="borrar-partido"?"¿Seguro? Se borran también sus tareas":"¿Seguro? Pulsa otra vez";setTimeout(()=>{if(b.isConnected){b.classList.remove("arm");b.textContent=b.dataset.txt}},4000);return}
    if(a==="borrar-partido"){const ts=tareasDe(id);await escribe(db=>Promise.all(ts.map(t=>db.doc("tareas/"+t.id).delete())));await delDoc("partidos",id,"Partido borrado");cierraModal();location.hash="partidos";return}
    await delDoc(b.dataset.col,id,"Borrado");if(b.dataset.cerrar)cierraModal();return}
  if(a==="add-persona"){const n=$("#np-nombre").value.trim();if(!n)return $("#np-nombre").focus();await setDoc("personas",nid("u"),{nombre:n,rol:$("#np-rol").value.trim()},"Persona añadida");return}
  if(a==="add-dep"){const n=$("#nd-nombre").value.trim();if(!n)return $("#nd-nombre").focus();const max=Math.max(0,...S.deps.map(d=>d.orden||0));await setDoc("departamentos",nid("d"),{nombre:n,orden:max+1},"Departamento añadido");return}
  if(a==="subir"||a==="bajar"){const ds=[...S.deps].sort((x,y)=>(x.orden||0)-(y.orden||0));const i=ds.findIndex(d=>d.id===id);const j=a==="subir"?i-1:i+1;if(j<0||j>=ds.length)return;
    await escribe(db=>Promise.all(ds.map((d,k)=>{const o=k===i?j:k===j?i:k;return (d.orden===o)?null:db.doc("departamentos/"+d.id).update({orden:o})}).filter(Boolean)));return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="solo-pend"){S.ui.soloPend=t.checked;guardaUI();return render()}
  if(t.id==="ver-pas"){S.ui.verPasados=t.checked;guardaUI();return render()}
  if(t.dataset.col&&t.dataset.f){const v=t.value.trim();const cur=(t.dataset.col==="personas"?persona(t.dataset.id):dep(t.dataset.id))||{};if(t.dataset.f==="nombre"&&!v){t.value=cur.nombre||"";return}if(cur[t.dataset.f]!==v)updDoc(t.dataset.col,t.dataset.id,{[t.dataset.f]:v},"Guardado");return}
  if(t.id==="bal-mejoras"||t.id==="bal-positivos"){const p=partido(t.dataset.pid);const f=t.id==="bal-mejoras"?"mejoras":"positivos";if(p&&(p[f]||"")!==t.value)updDoc("partidos",p.id,{[f]:t.value},"Balance guardado")}
});
document.addEventListener("input",e=>{if(e.target.id==="buscar"){S.qs[pidActual()]=e.target.value;clearTimeout(render.t);render.t=setTimeout(render,180)}});

/* ---------- datos ---------- */
render();
const CLAVE_K="dp-clave";
function leeClave(){try{return localStorage.getItem(CLAVE_K)||S._clave||""}catch(e){return S._clave||""}}
function guardaClave(v){S._clave=v;try{v?localStorage.setItem(CLAVE_K,v):localStorage.removeItem(CLAVE_K)}catch(e){}}
(()=>{const u=new URL(location.href);const k=u.searchParams.get("k");if(k){guardaClave(k);u.searchParams.delete("k");history.replaceState(null,"",u.pathname+u.search+u.hash)}})();
const COLMAP={partidos:"partidos",tareas:"tareas",personas:"personas",departamentos:"deps"};
async function enviar(escrituras){
  const r=await fetch("/api/escribir",{method:"POST",headers:{"content-type":"application/json","x-clave":leeClave()},body:JSON.stringify({escrituras})});
  if(r.status===401||r.status===403)throw{code:"invalid_argument"};
  if(!r.ok)throw{code:"unavailable"};
  for(const w of escrituras){const arr=S[COLMAP[w.col]];const i=arr.findIndex(x=>x.id===w.id);
    if(w.op==="delete"){if(i>=0)arr.splice(i,1)}
    else if(w.op==="set"){const d={...w.data,id:w.id};if(i>=0)arr[i]=d;else arr.push(d)}
    else if(i>=0)arr[i]={...arr[i],...w.data}}
  pintaSiPuede();
}
S.db={doc(path){const [col,id]=path.split("/");return{set:d=>enviar([{op:"set",col,id,data:d}]),update:d=>enviar([{op:"update",col,id,data:d}]),delete:()=>enviar([{op:"delete",col,id}])}}};
function pintaSiPuede(){if(!$("#modal").hidden||escribiendo()){S.pendiente=true;return}render()}
async function cargar(){
  const k=leeClave();if(!k){S.pideClave=true;return render()}
  try{
    const r=await fetch("/api/datos",{headers:{"x-clave":k},cache:"no-store"});
    if(r.status===401){S.pideClave=true;S.claveMal=true;guardaClave("");return render()}
    if(!r.ok)throw 0;
    const d=await r.json();
    const antes=S.pideClave;S.pideClave=false;S.claveMal=false;S.error=null;
    S.rol=d.rol;S.puede=d.rol==="editor";S.puedeConfirmado=S.puede;
    for(const c in COLMAP){S[COLMAP[c]]=d[c]||[];S.cargado[c]=true}
    antes?render():pintaSiPuede();
  }catch(e){if(!S.cargado.partidos){S.error="No se pueden cargar los datos. Revisa la conexión y recarga la página.";render()}}
}
document.addEventListener("submit",e=>{if(e.target.id!=="form-clave")return;e.preventDefault();const v=$("#clave").value.trim();if(!v)return;guardaClave(v);$("#app").innerHTML=`<div class="vacio">Comprobando la clave…</div>`;cargar()});
cargar();
setInterval(()=>{if(document.visibilityState==="visible"&&!S.pideClave)cargar()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!S.pideClave)cargar()});
function escribiendo(){const a=document.activeElement;return !!(a&&$("#app").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"&&a.id!=="buscar")))}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pendiente&&!escribiendo()&&$("#modal").hidden){S.pendiente=false;render()}},50));
// repintar al cerrar el modal por si llegaron cambios
new MutationObserver(()=>{if($("#modal").hidden)render()}).observe($("#modal"),{attributes:true,attributeFilter:["hidden"]});
</script>
