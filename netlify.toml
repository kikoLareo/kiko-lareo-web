# Configuración de despliegue en Netlify.
# Al crear el sitio en Netlify, selecciona este repositorio; esta
# configuración le dice que la web vive en la carpeta web/.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
# La lista completa de trabajos vivió en /archivo hasta el 28/09/2026;
# se renombró a /trabajo porque nadie la buscaba bajo "archivo".
[[redirects]]
  from = "/archivo"
  to = "/trabajo/"
  status = 301

[[redirects]]
  from = "/archivo/*"
  to = "/trabajo/"
  status = 301

# kikolareo.es redirige al dominio principal (SEO: una sola web canónica)
[[redirects]]
  from = "https://kikolareo.es/*"
  to = "https://kikolareo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kikolareo.es/*"
  to = "https://kikolareo.com/:splat"
  status = 301
  force = true
