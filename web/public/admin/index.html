<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel — Kiko Lareo®</title>
<meta name="robots" content="noindex">
<style>
  /* ==========================================================================
     Ajustes propios del panel para que se pueda usar desde el móvil.
     Decap CMS está pensado para escritorio: esto no lo reescribe, pero
     corrige lo que más estorba en una pantalla pequeña.
     Los selectores usan [class*="..."] porque Decap genera las clases con
     un prefijo aleatorio pero conserva el nombre del componente al final.
     ========================================================================== */

  html { -webkit-text-size-adjust: 100%; }

  @media (max-width: 900px) {
    /* Los campos a 16px evitan que el móvil haga zoom solo al escribir */
    input, textarea, select,
    [class*="ControlContainer"] input,
    [class*="ControlContainer"] textarea {
      font-size: 16px !important;
    }

    /* Contenedores con ancho fijo → ancho completo y menos margen lateral */
    [class*="AppMainContainer"],
    [class*="EditorContainer"],
    [class*="EditorContent"],
    [class*="ControlPaneContainer"],
    [class*="CollectionMain"],
    [class*="SearchResultContainer"] {
      max-width: 100% !important;
      width: 100% !important;
      min-width: 0 !important;
      padding-left: 10px !important;
      padding-right: 10px !important;
    }

    /* El editor parte la pantalla en dos; en móvil sobra la previsualización */
    [class*="PreviewPaneContainer"],
    [class*="EditorToggle"] { display: none !important; }

    [class*="EditorContent"] { grid-template-columns: 1fr !important; display: block !important; }

    /* Barras de herramientas: que bajen de línea en vez de salirse */
    [class*="EditorToolbar"],
    [class*="ViewControls"],
    [class*="ToolbarSubSectionFirst"],
    [class*="ToolbarSectionMain"] {
      flex-wrap: wrap !important;
      height: auto !important;
      gap: 6px !important;
      padding: 8px 10px !important;
    }

    /* Botones y controles con tamaño para el dedo (mínimo 44 px) */
    button,
    [class*="ToolbarButton"],
    [class*="ListItemTopBar"] button {
      min-height: 44px !important;
    }

    /* Listas de entradas y de campos: una sola columna */
    [class*="CardsGrid"] { grid-template-columns: 1fr !important; display: block !important; }
    [class*="CardsGrid"] > * { width: 100% !important; margin: 0 0 12px !important; }

    /* La barra lateral de colecciones, arriba y a lo ancho */
    [class*="SidebarContainer"] {
      position: static !important;
      width: 100% !important;
      max-width: 100% !important;
      padding: 8px 10px !important;
    }

    /* Selector de medios (la ventana para elegir fotos) a pantalla casi completa */
    [class*="MediaLibraryModal"],
    .ReactModal__Content {
      width: 96vw !important;
      max-width: 96vw !important;
      height: 90vh !important;
      max-height: 90vh !important;
      inset: 2vh 2vw !important;
      transform: none !important;
    }

    /* Rejilla de la biblioteca de medios: miniaturas más grandes al tacto */
    [class*="MediaLibraryCardGrid"] { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; }

    /* Nada debe provocar scroll horizontal */
    body { overflow-x: hidden !important; }
  }
</style>
</head>
<body>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
